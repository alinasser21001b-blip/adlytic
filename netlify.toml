# ─────────────────────────────────────────────────────────────────────────────
# Netlify — publishes the ADS PULSE site only (public/adspulse).
#
# `base` matters here: the repository root is the Adlytic Node app, whose
# package.json runs `prisma generate` on postinstall. Pointing the build
# context at public/adspulse means Netlify finds no package.json, installs
# nothing, and simply uploads the folder. The app itself keeps deploying to
# Railway from railway.toml — the two never touch.
#
# Paths below are relative to `base`, per Netlify's build settings.
# ─────────────────────────────────────────────────────────────────────────────

[build]
  base    = "public/adspulse"
  publish = "."
  command = "echo 'Static site — no build step, no dependencies.'"

# ── caching ──────────────────────────────────────────────────────────────────
# The font subsets are frozen: same glyphs, same filenames, forever.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images may be re-encoded one day, so a month rather than a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# The page carries all of its own markup, CSS and JS, so it must always be
# revalidated — otherwise an edit ships but nobody sees it.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── headers ──────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Frame-Options        = "SAMEORIGIN"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"
