<!DOCTYPE html>
<!--
    THIS IS A TEMPLATE THAT SHOULD BE USED EVERY TIME AND MODIFIED.
    WHAT TO KEEP:
    ✓ Overall structure (header, sidebar, main content)
    ✓ Anthropic branding (colors, fonts, layout)
    ✓ Seed navigation section (always include this)
    ✓ Self-contained artifact (everything inline)

    WHAT TO CREATIVELY EDIT:
    ✗ The p5.js algorithm (implement YOUR vision)
    ✗ The parameters (define what YOUR art needs)
    ✗ The UI controls (match YOUR parameters)

    Let your philosophy guide the implementation.
    The world is your oyster - be creative!
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counselled Clarity — Adlytic</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers (CUSTOMIZE THIS FOR YOUR ART) -->
            <h1>Counselled Clarity</h1>
            <div class="subtitle">Adlytic visual DNA — insight as aperture, not engine. Particles seek the counsel slit; most never enter.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42107" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section (CUSTOMIZE THIS FOR YOUR ART) -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="800" max="6000" step="200" value="2800" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">2800</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Aperture Width</label>
                    <div class="slider-container">
                        <input type="range" id="apertureWidth" min="8" max="48" step="1" value="18" oninput="updateParam('apertureWidth', this.value)">
                        <span class="value-display" id="apertureWidth-value">18</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Counsel Drift</label>
                    <div class="slider-container">
                        <input type="range" id="counselDrift" min="0.05" max="1.2" step="0.05" value="0.35" oninput="updateParam('counselDrift', this.value)">
                        <span class="value-display" id="counselDrift-value">0.35</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.02" step="0.001" value="0.004" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.004</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Settle Rate</label>
                    <div class="slider-container">
                        <input type="range" id="settleRate" min="0.01" max="0.2" step="0.01" value="0.06" oninput="updateParam('settleRate', this.value)">
                        <span class="value-display" id="settleRate-value">0.06</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Signal Scarcity</label>
                    <div class="slider-container">
                        <input type="range" id="signalScarcity" min="0.02" max="0.35" step="0.01" value="0.12" oninput="updateParam('signalScarcity', this.value)">
                        <span class="value-display" id="signalScarcity-value">0.12</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section (OPTIONAL - CUSTOMIZE OR REMOVE) -->
            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Forest Ground</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#0E4034" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#0E4034</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Daylight Field</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#F2F7F4" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#F2F7F4</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Signal Lime</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#C8F26B" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#C8F26B</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button tertiary" onclick="regenerate()">Regenerate</button>
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
                <div class="button-row" style="margin-top:8px">
                    <button class="button secondary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART PARAMETERS — Counselled Clarity (Adlytic)
        // Conceptual seed: advisor aperture — recommends, never spends.
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 42107,
            particleCount: 2800,
            apertureWidth: 18,
            counselDrift: 0.35,
            noiseScale: 0.004,
            settleRate: 0.06,
            signalScarcity: 0.12,
            colorPalette: ['#0E4034', '#F2F7F4', '#C8F26B']
        };

        let defaultParams = JSON.parse(JSON.stringify(params));
        let particles = [];
        let frameTick = 0;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            pixelDensity(1);
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            frameTick = 0;
            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new CounselParticle());
            }
            background(params.colorPalette[1]);
            drawAperturePlate(false);
        }

        function drawAperturePlate(glowOnly) {
            const cx = width / 2;
            const cy = height / 2;
            const plate = 620;
            noStroke();
            if (!glowOnly) {
                fill(red(color(params.colorPalette[0])), green(color(params.colorPalette[0])), blue(color(params.colorPalette[0])), 18);
                rectMode(CENTER);
                rect(cx, cy, plate + 80, plate + 80, 96);
                fill(params.colorPalette[0]);
                rect(cx, cy, plate, plate, 84);
            }
            // Counsel slit
            const w = params.apertureWidth * 2.8;
            fill(params.colorPalette[2]);
            beginShape();
            vertex(cx - w * 0.35, cy - plate * 0.32);
            vertex(cx + w * 0.35, cy - plate * 0.32);
            vertex(cx + w * 0.55, cy + plate * 0.32);
            vertex(cx - w * 0.55, cy + plate * 0.32);
            endShape(CLOSE);
            // Human decision core (darker inset)
            fill(red(color(params.colorPalette[0])), green(color(params.colorPalette[0])), blue(color(params.colorPalette[0])), 140);
            rect(cx, cy - 10, w * 0.42, plate * 0.22, 20);
        }

        function draw() {
            // Soft field veil — settling, not spectacle
            noStroke();
            fill(red(color(params.colorPalette[1])), green(color(params.colorPalette[1])), blue(color(params.colorPalette[1])), 18);
            rect(0, 0, width, height);

            // Reassert aperture as fixed counsel instrument
            drawAperturePlate(false);

            for (let p of particles) {
                p.update();
                p.show();
            }
            frameTick++;
            if (frameTick > 900) {
                // Hold equilibrium — mastercraft refuses climax
                noLoop();
            }
        }

        class CounselParticle {
            constructor() {
                this.reset(true);
            }

            reset(initial) {
                const edge = random() < 0.5;
                if (edge) {
                    this.pos = createVector(random(width), random() < 0.5 ? -20 : height + 20);
                } else {
                    this.pos = createVector(random() < 0.5 ? -20 : width + 20, random(height));
                }
                this.vel = createVector(0, 0);
                this.life = initial ? random(40, 220) : 220;
                this.age = 0;
                this.chosen = random() < params.signalScarcity;
                this.hist = [];
            }

            update() {
                const cx = width / 2;
                const cy = height / 2;
                const n = noise(this.pos.x * params.noiseScale, this.pos.y * params.noiseScale, frameTick * 0.002);
                const swirl = (n - 0.5) * TWO_PI;

                // Pressure toward vertical counsel axis — selection, not command
                const toAxis = createVector(cx - this.pos.x, (cy - this.pos.y) * 0.15);
                toAxis.normalize().mult(params.counselDrift);

                const wander = p5.Vector.fromAngle(swirl).mult(0.45);
                this.vel.add(toAxis);
                this.vel.add(wander);
                this.vel.mult(1 - params.settleRate * 0.35);
                this.vel.limit(2.2);
                this.pos.add(this.vel);

                // Aperture gate: only scarce signal particles may enter the slit channel
                const halfW = params.apertureWidth * 1.6;
                const insidePlate = abs(this.pos.x - cx) < 310 && abs(this.pos.y - cy) < 310;
                const inSlit = abs(this.pos.x - cx) < halfW && abs(this.pos.y - cy) < 260;
                if (insidePlate && !inSlit) {
                    // Deflect — recommendation channel is narrow on purpose
                    this.vel.x += (this.pos.x < cx ? -1 : 1) * 0.35;
                    this.pos.x += (this.pos.x < cx ? -1.2 : 1.2);
                }
                if (inSlit && !this.chosen) {
                    this.vel.x += (this.pos.x < cx ? -0.8 : 0.8);
                }

                this.hist.push(this.pos.copy());
                if (this.hist.length > 6) this.hist.shift();

                this.age++;
                if (this.age > this.life || this.pos.x < -40 || this.pos.x > width + 40 || this.pos.y < -40 || this.pos.y > height + 40) {
                    this.reset(false);
                }
            }

            show() {
                const speed = this.vel.mag();
                for (let i = 1; i < this.hist.length; i++) {
                    const a = this.hist[i - 1];
                    const b = this.hist[i];
                    if (this.chosen && abs(b.x - width / 2) < params.apertureWidth * 2.2) {
                        const sig = color(params.colorPalette[2]);
                        stroke(red(sig), green(sig), blue(sig), 170);
                        strokeWeight(1.4);
                    } else {
                        const ink = color(params.colorPalette[0]);
                        stroke(red(ink), green(ink), blue(ink), 28 + speed * 20);
                        strokeWeight(0.8);
                    }
                    line(a.x, a.y, b.x, b.y);
                }
                noStroke();
                if (this.chosen) {
                    fill(params.colorPalette[2]);
                    circle(this.pos.x, this.pos.y, 2.2);
                } else {
                    fill(red(color(params.colorPalette[0])), green(color(params.colorPalette[0])), blue(color(params.colorPalette[0])), 50);
                    circle(this.pos.x, this.pos.y, 1.6);
                }
            }
        }

        function updateParam(paramName, value) {
            const numeric = ['particleCount', 'apertureWidth'];
            params[paramName] = numeric.includes(paramName) ? parseInt(value, 10) : parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            loop();
            initializeSystem();
        }

        function updateColor(colorId, value) {
            const idx = { color1: 0, color2: 1, color3: 2 }[colorId];
            params.colorPalette[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
            loop();
            initializeSystem();
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                loop();
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        function regenerate() {
            loop();
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('counselled-clarity-' + params.seed, 'png');
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('apertureWidth').value = params.apertureWidth;
            document.getElementById('apertureWidth-value').textContent = params.apertureWidth;
            document.getElementById('counselDrift').value = params.counselDrift;
            document.getElementById('counselDrift-value').textContent = params.counselDrift;
            document.getElementById('noiseScale').value = params.noiseScale;
            document.getElementById('noiseScale-value').textContent = params.noiseScale;
            document.getElementById('settleRate').value = params.settleRate;
            document.getElementById('settleRate-value').textContent = params.settleRate;
            document.getElementById('signalScarcity').value = params.signalScarcity;
            document.getElementById('signalScarcity-value').textContent = params.signalScarcity;
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];
            updateSeedDisplay();
            loop();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
