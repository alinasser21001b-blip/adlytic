# ═══════════════════════════════════════════════════════════════════════════
# Dawai — Release Manifest
#
# THIS FILE IS THE SOLE OPERATIONAL SOURCE OF TRUTH FOR A RELEASE.
#
# Every version number, compatibility range, verification status, approved
# runtime configuration, and artifact path that appears anywhere — in the
# changelog, the release notes, the compatibility report, the governance
# dashboard, or the deployment metadata — is READ FROM HERE by CI.
#
# Do not write a version number in two places. A number written twice is a
# number that will drift, and a governance framework whose inputs drift is
# theatre.
#
#   Validate:  node tools/release/validate.mjs
#   Generate:  node tools/release/generate.mjs
#
# Generated outputs are never hand-edited. If a generated file is wrong,
# the manifest is wrong.
# ═══════════════════════════════════════════════════════════════════════════

schemaVersion: 1
releaseId: "platform-1.5.0"

# draft | candidate | released | superseded | withdrawn
# CI refuses to set `released` until every condition in
# docs/governance/RELEASE_POLICY.md § Release Rule is satisfied.
status: candidate
releasedAt: null

governance:
  # The policy the release was JUDGED BY, not the policy that exists today.
  # Platform 1.5.0 stays bound to Policy 1.0.0 forever, even after the policy
  # becomes 2.0.0. Never rewrite history to make an old release look as though
  # it passed rules that did not exist when it shipped.
  policyVersion: "1.0.0"
  policyUpdatedAt: "2026-07-20"
  # ADRs carry their title, date, and status here rather than in the dashboard
  # markup. A decision record referenced by bare id in the UI forces a reader
  # to go looking; and a title kept in a second file is a title that will
  # eventually describe a different decision than the one it is next to.
  adrs:
    - id: "ADR-014"
      title: "Evidence Traceability"
      decidedAt: "2026-07-28"
      status: accepted
    - id: "ADR-015"
      title: "Safety Alert Contract"
      decidedAt: "2026-07-30"
      status: accepted
    - id: "ADR-016"
      title: "Release Manifest as SSOT"
      decidedAt: "2026-08-01"
      status: accepted
  approvals:
    ux: pending
    accessibility: pending
    rtl: pending
    clinical: pending
    engineering: pending
    evidence: pending

