# ── Clinical contracts ─────────────────────────────────────────────────────
# Behaviour and clinical meaning, versioned independently of the knowledge
# CONTENT they operate on. A contract change is a code change; a knowledge
# change is a content change. Conflating them is how a copy edit silently
# becomes a clinical behaviour change.
clinicalContracts:
  - name: "interaction-check"
    version: "2.1.0"
    supported: "2.1.x"
    breakingChange: false
  - name: "safety-alert"
    version: "3.0.0"
    supported: "3.0.x"
    breakingChange: true
  - name: "dispense"
    version: "1.2.0"
    supported: "1.2.x"
    breakingChange: false
  - name: "medication-timeline"
    version: "1.0.0"
    supported: "1.0.x"
    breakingChange: false
  - name: "adherence"
    version: "1.1.0"
    supported: "1.1.x"
    breakingChange: false
  - name: "inventory-observation"
    version: "1.0.0"
    supported: "1.0.x"
    breakingChange: false

# ── Feature flags ──────────────────────────────────────────────────────────
# Every flag has an owner, a declared clinical impact, and a removal version.
# A flag with no removal version is permanent complexity pretending to be
# temporary. `removeBy` at or below release.platform is a blocking defect.
featureFlags:
  - name: "reservation_live_eta_v2"
    category: "operational"
    owner: "Product + Engineering"
    clinicalImpact: "none"
    default: false
    removeBy: "2.0.0"
  - name: "pharmacist_inbox_density_v2"
    category: "presentation"
    owner: "Design System"
    clinicalImpact: "none"
    default: false
    removeBy: "1.6.0"
  - name: "safety_alert_new_copy"
    category: "clinical-adjacent"
    owner: "Clinical + Product"
    clinicalImpact: "review-required"
    default: false
    removeBy: "1.6.0"
  - name: "interaction_priority_rules_v3"
    category: "clinical-safety"
    owner: "Clinical Governance"
    clinicalImpact: "high"
    default: false
    removeBy: "3.0.0"

# ── UI claim bindings ──────────────────────────────────────────────────────
# Every UI element that renders a clinical output declares which claim it is
# rendering. The UI does NOT decide whether a claim is valid — it displays an
# output produced by a verified contract and knowledge layer. It carries the
# reference so an auditor can walk from a screen back to the claim, its
# source, its reviewer, and its release without guessing.
uiClaimBindings:
  - selector: "[data-clinical-claim]"
    file: "dawai-site/dawai-ui-kit.html"
    requiredAttributes:
      - "data-clinical-claim"
      - "data-clinical-contract"
      - "data-knowledge-release"

