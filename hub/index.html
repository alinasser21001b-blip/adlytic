<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- The webfont must never block first paint. On a throttled Baghdad 4G the
     blocking stylesheet cost ~14s to interactive; loaded this way the app
     renders immediately in the system Arabic face and swaps when the real one
     lands. Text -> structure -> interaction -> polish. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap"></noscript>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="css/qareeb.css">
<link rel="stylesheet" href="src/styles/qareeb.css">
</head>
