<meta name="theme-color" content="#F4F1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1412" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" sizes="180x180" href="favicon.svg">

<!-- WhatsApp / Open Graph share card — the real growth surface -->
<meta property="og:type" content="website">
<meta property="og:title" content="قريب — أقرب رعاية إليك">

<meta property="og:locale" content="ar_IQ">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The webfont must never block first paint. On a throttled Baghdad 4G a
     blocking stylesheet cost ~14s to interactive; loaded this way the app
     renders immediately in the system Arabic face and swaps when the real one
     lands. Text -> structure -> interaction -> polish.

     Two families, not three. Readex Pro is the Arabic-native display face,
     axis narrowed to 300..600 — the range actually used, since 200 appears
     only on .nhuge which is set in the numeral face anyway. IBM Plex Sans
     carries every numeral. IBM Plex Mono was dropped: it was pulling a whole
     third family for nine ref codes and an axis label, which IBM Plex Sans
     with tabular figures and tracking renders just as legibly. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..600&family=IBM+Plex+Sans:wght@200;300;400&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..600&family=IBM+Plex+Sans:wght@200;300;400&display=swap"></noscript>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="src/styles/identity.css">
<link rel="stylesheet" href="css/qareeb.css">
</head>
<body>
  <main class="app" id="app" role="main"></main>
  <script defer src="js/domain.js"></script>
  <script defer src="js/emr.js"></script>
  <script defer src="js/record.js"></script>
  <script defer src="js/consent.js"></script>
  <script defer src="js/network.js"></script>
  <script defer src="js/sync.js"></script>
  <script defer src="js/assist.js"></script>
  <script defer src="js/transport.js"></script>
  <script defer src="js/data.js"></script>
  <!-- ORDER IS LOAD-BEARING. These are classic scripts sharing one global
       lexical scope, split from a single file at its own section comments.
       The sequence is the original file's sequence; reordering reintroduces
       the temporal dead zone that whole-file function hoisting used to hide.

       `defer` preserves that order exactly — deferred classic scripts execute
       in document order, before DOMContentLoaded, which is what `boot()`
       waits for. What it changes is the DOWNLOAD: without it the browser
       fetches and runs these sixteen files one after another, sixteen
       sequential round trips. Measured on a 4x-throttled CPU at ~400 kbps
       with 300 ms latency — a fair approximation of an Iraqi mid-range phone
       on mobile data — that was 18.8 seconds to the first painted screen. -->
  <script defer src="js/ui-core.js"></script>
  <script defer src="js/ui-discovery.js"></script>
  <script defer src="js/ui-backend.js"></script>
  <script defer src="js/ui-needs.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/ui-record.js"></script>
  <script defer src="js/ui-network.js"></script>
</body>
</html>
