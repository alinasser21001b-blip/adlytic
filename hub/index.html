<!-- The webfont must never block first paint. On a throttled Baghdad 4G a
     blocking stylesheet cost ~14s to interactive; loaded this way the app
     renders immediately in the system Arabic face and swaps when the real one
     lands. Text -> structure -> interaction -> polish.

     Two families, not three. Readex Pro is the Arabic-native display face,
     axis narrowed to 300..600 — the range actually used, since 200 appears
     only on .nhuge which is set in the numeral face anyway. IBM Plex Sans
     carries every numeral. IBM Plex Mono was dropped: it was pulling a whole
     third family for nine ref codes and an axis label, which IBM Plex Sans
     with tabular figures and tracking renders just as legibly. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..600&family=IBM+Plex+Sans:wght@200;300;400&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..600&family=IBM+Plex+Sans:wght@200;300;400&display=swap"></noscript>
