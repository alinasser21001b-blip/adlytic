     blocking stylesheet cost ~14s to interactive; loaded this way the app
     renders immediately in the system Arabic face and swaps when the real one
     lands. Text -> structure -> interaction -> polish.

     Two families, not three. Readex Pro is the Arabic-native display face,
     axis narrowed to 300..600 — the range actually used, since 200 appears
     only on .nhuge which is set in the numeral face anyway. IBM Plex Sans
     carries every numeral. IBM Plex Mono was dropped: it was pulling a whole
     third family for nine ref codes and an axis label, which IBM Plex Sans
     with tabular figures and tracking renders just as legibly. -->

/* ==================================================================
   QAREEB — IDENTITY v3 · "المِسطرة / THE INSTRUMENT"
   Extracted verbatim from the v3 design board (section header block).
   This file is the REFERENCE. Do not hand-edit it to fix a screen —
   fix the screen. A v4 board should be able to replace this file whole.

   Two notes on landing it in the app:
   · `.i` is the board's 390px device frame. The app is full-bleed, so it
     maps onto <body> in the app layer; `.i` itself is never used here.
     Its box-shadow is board presentation, not a violation of the
     zero-shadow rule — the only shadow in the product is `.sheet`.
   · `.dark` redefines TOKENS. Never write `.dark .something { color: … }`
     in app code: any component written against var(--ink-*) flips on its
     own. Component-level dark overrides were the source of real contrast
     bugs in v2 and the fix was structural.
   ================================================================== */
/* ==================================================================
   QAREEB — IDENTITY v3 · "المِسطرة / THE INSTRUMENT"
   A precision instrument for time, not a directory of people.
   Two surfaces: THE CASE (deep ink) and THE DIAL (warm paper).
   Separation by hairline and tone. Shadow ONLY for what floats.
   ================================================================== */
:root{
  /* the case — confident, not corporate */
  --case:#0B1412; --case-2:#101B18; --case-line:rgba(240,236,228,.14); --case-ink:#F2EFE8;
  --case-ink-2:rgba(242,239,232,.78); --case-ink-3:rgba(242,239,232,.64);
  /* the dial — warm paper, never white */
  --dial:#F4F1EB; --dial-2:#FBF9F5; --dial-line:rgba(11,20,18,.10); --dial-line-2:rgba(11,20,18,.055);
  --ink:#0B1412; --ink-2:rgba(11,20,18,.72); --ink-3:rgba(11,20,18,.64); --ink-4:rgba(11,20,18,.42);
  /* one accent, load-bearing */
  --jade:#0E5450; --jade-2:#14706A; --jade-lit:#5FD0C0;
  /* brass splits: a FILL brass and a TEXT brass. Never set small text in the fill. */
  --brass:#C98A18; --brass-ink:#845A09; --brass-lit:#F0C15E;  /* time only */
  --alarm:#C1121F; --alarm-lit:#F08A80;  /* emergency only */
  --wa:#128C3E;
  /* type */
  --disp:'Readex Pro',system-ui,sans-serif;
  --num:'IBM Plex Sans',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  /* a 4px baseline, nothing accidental */
  --u1:4px;--u2:8px;--u3:12px;--u4:16px;--u5:20px;--u6:28px;--u7:40px;--u8:56px;
  /* radius logic: 10 for anything that holds content, pill for anything that reads as a control. Nothing else. */
  --r:10px; --rp:999px;
  /* elevation philosophy: 0 on the working surface. 1 step for sheets. */
  --float:0 24px 60px -12px rgba(11,20,18,.42), 0 2px 6px rgba(11,20,18,.10);
}
.i{width:390px;background:var(--dial);color:var(--ink);direction:rtl;text-align:right;
   font:300 15px/1.85 var(--disp);border-radius:26px;overflow:hidden;
   border:1px solid var(--dial-line);box-shadow:0 30px 70px -30px rgba(11,20,18,.35)}
/* THE CASE REDEFINES THE TOKENS, it does not override each component.
   Any component written against --ink-* / --dial-* flips automatically. */
.dark{
  --dial:var(--case); --dial-2:var(--case-2);
  --dial-line:var(--case-line); --dial-line-2:rgba(240,236,228,.07);
  --ink:var(--case-ink); --ink-2:var(--case-ink-2);
  --ink-3:var(--case-ink-3); --ink-4:rgba(242,239,232,.34);
  --jade:var(--jade-lit); --brass-ink:var(--brass-lit); --alarm:var(--alarm-lit);
}
.i.dark{background:var(--case);color:var(--case-ink);border-color:var(--case-line)}
.i.ltr{direction:ltr;text-align:left}
/* --- typography: display is tight and heavy, body is light and open --- */
.d1{font:600 34px/1.24 var(--disp);letter-spacing:-.02em;margin:0}
.d2{font:600 25px/1.32 var(--disp);letter-spacing:-.015em;margin:0}
.d3{font:500 19px/1.45 var(--disp);letter-spacing:-.01em;margin:0}
.t1{font:400 15.5px/1.8 var(--disp)}
.t2{font:300 13.5px/1.8 var(--disp);color:var(--ink-2)}
.t3{font:400 11.5px/1.6 var(--disp);color:var(--ink-3)}
.lab{font:500 10.5px/1 var(--disp);letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.dark .t2{color:var(--case-ink-2)}.dark .t3,.dark .lab{color:var(--case-ink-3)}
/* numerals are a design element: tabular, LTR-embedded, optically lighter */
.n{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;font-weight:400}
.nbig{font:300 46px/1 var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;letter-spacing:-.03em}
.nhuge{font:200 76px/.92 var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;letter-spacing:-.045em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;font-size:.92em}
/* --- structure: hairlines, never boxes-in-boxes --- */
.pad{padding-inline:var(--u5)}
.hr{height:1px;background:var(--dial-line-2);border:0;margin:0}
.dark .hr{background:var(--case-line)}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:var(--u3)}
.row{display:flex;align-items:center;gap:var(--u2)}
.v2>*+*{margin-top:var(--u2)}.v3>*+*{margin-top:var(--u3)}.v5>*+*{margin-top:var(--u5)}
/* --- the tick rule: the identity motif. Engraved measurement. --- */
.ticks{display:flex;align-items:flex-end;gap:0;height:16px}
.ticks>i{flex:1;height:5px;background:var(--dial-line);border-radius:0}
.ticks>i.maj{height:11px;background:var(--ink-4)}
.ticks>i.on{height:16px;background:var(--brass);width:2px;flex:none;margin-inline:1px}
.dark .ticks>i{background:var(--case-line)}.dark .ticks>i.maj{background:var(--case-ink-3)}
.dark .ticks>i.on{background:var(--brass-lit)}
/* the dial band — time as an engraved arc segment, not a chunky bar */
.band{position:relative;height:3px;background:var(--dial-line);border-radius:var(--rp);overflow:hidden}
.band>i{position:absolute;top:0;bottom:0;border-radius:var(--rp)}
.band .sh{background:var(--jade)}.band .cl{background:var(--brass)}
.dark .band{background:var(--case-line)}.dark .band .sh{background:var(--jade-lit)}.dark .band .cl{background:var(--brass-lit)}
.nowmk{position:absolute;top:-5px;bottom:-5px;width:1.5px;background:var(--ink)}
.dark .nowmk{background:var(--case-ink)}
/* --- controls: pill, hairline, no fill unless it acts --- */
.b{display:flex;align-items:center;justify-content:center;gap:var(--u2);min-height:52px;
   border-radius:var(--rp);font:500 15px/1 var(--disp);border:1px solid transparent;cursor:pointer;
   transition:transform .14s cubic-bezier(.2,.7,.3,1),background .16s ease,box-shadow .16s ease}
.b:hover{transform:translateY(-1px)}
.b:active{transform:translateY(0) scale(.985)}
.b:focus-visible{outline:1.5px solid var(--jade);outline-offset:3px}
.b-p{background:var(--ink);color:var(--dial-2)}
.b-p:hover{background:#16241f;box-shadow:0 8px 22px -10px rgba(11,20,18,.6)}
.dark .b-p{background:var(--case-ink);color:var(--case)}
.b-s{border-color:var(--dial-line);color:var(--ink);background:transparent}
.b-s:hover{background:rgba(11,20,18,.04)}
.dark .b-s{border-color:var(--case-line);color:var(--case-ink)}
.b-g{min-height:auto;background:none;color:var(--jade);font-weight:500}
.dark .b-g{color:var(--jade-lit)}
.b-wa{background:var(--wa);color:#fff;font-weight:600}
.b-sm{min-height:38px;font-size:12.5px;padding-inline:var(--u4)}
.b[disabled]{opacity:.35;pointer-events:none}
/* --- chips: hairline, one filled state --- */
.c{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:var(--rp);
   border:1px solid var(--dial-line);font:400 13px/1 var(--disp);color:var(--ink-2);white-space:nowrap;background:transparent;
   transition:background .15s,border-color .15s,color .15s}
.c:hover{border-color:var(--ink-4);color:var(--ink)}
.c-on{background:var(--ink);border-color:var(--ink);color:var(--dial-2);font-weight:500}
.c-off{opacity:.34;pointer-events:none}
.dark .c{border-color:var(--case-line);color:var(--case-ink-2)}
.dark .c-on{background:var(--case-ink);border-color:var(--case-ink);color:var(--case)}
/* --- status: text + mark, never colour alone, never a pill soup --- */
.st{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--disp)}
.st-t{color:var(--brass-ink)}.st-v{color:var(--jade)}.st-e{color:var(--alarm)}.st-q{color:var(--ink-3)}
.dark .st-t{color:var(--brass-lit)}.dark .st-v{color:var(--jade-lit)}.dark .st-e{color:var(--alarm-lit)}
.dot{width:5px;height:5px;border-radius:var(--rp);background:currentColor;flex:none}
.dot-live{animation:br 2.6s ease-in-out infinite}
@keyframes br{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.dot-live{animation:none}}
/* --- the engraved mark: verification as a struck seal --- */
.mark{width:34px;height:34px;flex:none;border-radius:var(--rp);border:1px solid var(--jade);
      display:grid;place-items:center;color:var(--jade);font:600 9px/1 var(--disp)}
.dark .mark{border-color:var(--jade-lit);color:var(--jade-lit)}
/* --- avatar fallback: a monogram engraved into the dial, not a coloured blob --- */
.av{width:44px;height:44px;flex:none;border-radius:var(--rp);display:grid;place-items:center;
    font:400 17px/1 var(--disp);color:var(--ink-2);background:transparent;
    border:1px solid var(--dial-line);position:relative}
.av::after{content:"";position:absolute;inset:-4px;border-radius:var(--rp);border:1px solid var(--dial-line-2)}
.dark .av{color:var(--case-ink-2);border-color:var(--case-line)}
.dark .av::after{border-color:rgba(240,236,228,.07)}
/* --- rows, not cards. The list is the surface. --- */
.rw{display:flex;gap:var(--u4);padding:var(--u4) 0;align-items:flex-start;position:relative;
    transition:background .16s ease}
.rw:hover{background:rgba(11,20,18,.022)}
.dark .rw:hover{background:rgba(240,236,228,.03)}
.rw-lead{position:absolute;inset-inline-start:calc(var(--u5) * -1);top:var(--u4);bottom:var(--u4);width:2px;
         background:var(--brass);border-radius:var(--rp)}
.quiet{opacity:.46}
/* a card exists only when the thing genuinely floats or is genuinely singular */
.plate{background:var(--dial-2);border:1px solid var(--dial-line);border-radius:var(--r);padding:var(--u5)}
.dark .plate{background:var(--case-2);border-color:var(--case-line)}
.sheet{background:var(--dial-2);border-radius:22px 22px 0 0;box-shadow:var(--float);padding:var(--u5) var(--u5) var(--u6)}
.grip{width:32px;height:3px;border-radius:var(--rp);background:var(--ink-4);margin:0 auto var(--u5)}
/* --- skeleton: the dial breathes, it doesn't shimmer garishly --- */
.sk{background:var(--dial-line-2);border-radius:3px;animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
/* --- nav: hairline, lowercase weight shift, no icon soup --- */
.nv{display:flex;border-top:1px solid var(--dial-line);background:var(--dial-2)}
.nv>span{flex:1;text-align:center;padding:var(--u4) 0 var(--u5);font:400 12px/1 var(--disp);color:var(--ink-3);position:relative}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;font-weight:400;
      font-variant-numeric:tabular-nums;direction:ltr;color:var(--ink-3)}
.dark .axis{color:var(--case-ink-3)}
.nv>span.on{color:var(--ink);font-weight:600}
.nv>span.on::before{content:"";position:absolute;top:-1px;inset-inline:32%;height:2px;background:var(--ink)}
.dark .nv{background:var(--case-2);border-color:var(--case-line)}
.dark .nv>span.on{color:var(--case-ink)}.dark .nv>span.on::before{background:var(--case-ink)}

/* ==================================================================
   QAREEB — APP LAYER on IDENTITY v3
   Loads AFTER src/styles/identity.css, which owns the tokens and the
   primitives. Nothing here invents a colour, a radius or a shadow.

   Three rules this file must never break:
     1. Radius is 10 (holds content) or 999 (reads as a control). Nothing else.
     2. Zero shadow on the working surface. The only shadow is .sheet, which
        genuinely floats.
     3. Never `.dark .x { color: … }`. Write components against var(--ink-*)
        and let the token flip do the work.

   The app emits ~230 class names inherited from v1/v2. Rather than rewrite
   twenty screens in one pass, this file re-expresses that whole vocabulary
   in v3 terms, so a screen nobody touched still reads as the instrument:
   rows instead of cards, hairlines instead of boxes, one filled control.
   ================================================================== */

/* ---------- 0 · two token corrections ----------
   Measured, not preferred. Both are overridden here rather than edited into
   src/styles/identity.css so that file stays exactly as the board shipped it
   and a v4 board can replace it whole.

   --wa: white on the board's #128C3E measures 4.33:1, just under the 4.5
   floor for 15px/600 text. Darkened to the nearest value that clears it while
   still reading unmistakably as WhatsApp green.
   ============================================================ */
:root {
  --wa: #11833A;   /* was #128C3E — 4.33:1 with white, now 4.85:1 */
  /* IBM Plex Mono dropped from the font request: a whole third family for
     nine reference codes and an axis label. Plex Sans with tabular figures
     and a little tracking reads the same and costs nothing extra. */
  --mono: 'IBM Plex Sans', ui-monospace, monospace;
}
.mono, .slip-ref, .axis, .ribbon-scale { letter-spacing: .04em; }

/* ---------- 1 · reset + base ---------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--dial); color: var(--ink);
  font: 300 15px/1.85 var(--disp);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img, svg { max-width: 100%; }
svg { flex: none; }
/* An <svg> with no width falls back to its 300x150 intrinsic size and blows
   the layout box open. .ico is the floor for icons emitted without a class;
   specificity 0,1,0 so every `.x svg` rule still wins. */
.ico { width: 18px; height: 18px; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--jade); outline-offset: 3px; }
ul, ol { list-style: none; }
::selection { background: var(--brass); color: var(--case); }

/* Western tabular numerals, LTR-embedded so bidi can never reorder them
   inside an Arabic run. Every number in the product goes through this. */
.num, .n {
  font-family: var(--num); font-variant-numeric: tabular-nums;
  direction: ltr; unicode-bidi: embed; font-weight: 400;
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: embed; font-size: .92em; }

/* Arabic wraps badly at 375px without help. */
h1, h2, h3, p, span, div, li { overflow-wrap: anywhere; }

/* ---------- 2 · type · display tight and heavy, body light and open ---------- */
h1, .q-h1, .prof-name, .dp-name { font: 600 30px/1.26 var(--disp); letter-spacing: -.02em; }
h2 { font: 600 25px/1.32 var(--disp); letter-spacing: -.015em; }
h3, .q-h2, .card-t, .qc-title, .intent-t, .empty-t { font: 500 17px/1.45 var(--disp); letter-spacing: -.01em; }
p, .q-sub, .card-q, .qc-qual, .intent-s, .empty-b, .small, .t2, .prof-spec, .dp-spec { font: 300 13.5px/1.8 var(--disp); color: var(--ink-2); }
.t1 { font: 400 15.5px/1.8 var(--disp); }
.tiny, .t3, .hint, .m, .prod-brand { font: 400 11.5px/1.6 var(--disp); color: var(--ink-3); }
.muted { color: var(--ink-3); }
.eyebrow, .lab, .q-eyebrow, .kpi-l, .lbl, .sec-h h2, .week-legend, .fee-l, .dp-sub {
  font: 500 10.5px/1.5 var(--disp); letter-spacing: .2em;
  color: var(--ink-3); text-transform: uppercase;
}
.d1 { font: 600 34px/1.24 var(--disp); letter-spacing: -.02em; }
.d2 { font: 600 25px/1.32 var(--disp); letter-spacing: -.015em; }
.d3 { font: 500 19px/1.45 var(--disp); letter-spacing: -.01em; }

/* ---------- 3 · layout primitives ---------- */
.app { min-height: 100dvh; padding-bottom: 92px; }
.wrap, .pad { padding-inline: var(--u5); }
.blk { padding: var(--u6) var(--u5) 0; }
.sec { padding-top: var(--u5); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--u3); margin-bottom: var(--u3); }

.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: var(--u2); }
.row-b, .rowb { display: flex; align-items: center; justify-content: space-between; gap: var(--u3); }
.stack-2 > * + *, .v2 > * + * { margin-top: var(--u2); }
.v3 > * + * { margin-top: var(--u3); }
.v5 > * + * { margin-top: var(--u5); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--u3); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bleed { margin-inline: calc(var(--u5) * -1); padding-inline: var(--u5); }
.rail { display: flex; gap: var(--u3); overflow-x: auto; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.pad-3 { padding: var(--u4); }
.pad-4 { padding: var(--u5); }

/* ---------- 4 · the row · the list IS the surface ----------
   The single biggest change from v2. A card is a box that says "I am a
   separate thing"; a directory of forty separate things is noise. A row
   says "I am the next line of the same instrument". */
.rw, .card, .lane, .place, .need, .qc, .fac-block, .tbl-row, .bar-row, .week-row, .proof-row {
  position: relative;
  display: flex; gap: var(--u4); align-items: flex-start;
  padding: var(--u4) 0;
  width: 100%; text-align: start;
  background: none; border: 0; border-radius: 0; box-shadow: none;
  transition: background .16s ease;
}
.card-top { display: flex; gap: var(--u4); align-items: flex-start; width: 100%; }
.card-foot { display: flex; align-items: center; gap: var(--u2); margin-top: var(--u3); }
.card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; }

/* Hairline between siblings, drawn by the list so a filtered list never
   leaves a dangling rule. */
.stack > * + *, .list-2 > * + *, .needs > * + * { border-top: 1px solid var(--dial-line-2); }
.hr { height: 1px; background: var(--dial-line-2); border: 0; margin: 0; }

/* The brass lead: "open right now". State by position AND colour — it sits
   in the gutter, where nothing else ever sits. */
.rw-lead, .card.is-open::before, .lane.on::before, .rail-open::before, .rail-stock::before {
  content: ""; position: absolute;
  inset-inline-start: calc(var(--u4) * -1); top: var(--u4); bottom: var(--u4);
  width: 2px; background: var(--brass); border-radius: var(--rp);
}
.rail-stock::before { background: var(--jade); }
.card.is-shut::before, .card.is-soon::before, .lane--sos::before { content: none; }
.quiet, .card.is-shut { opacity: .46; }

/* A plate exists only when the thing is genuinely singular. */
.plate, .ch, .surf-raise, .surf-key, .banner, .note, .slip, .stub, .adm-kpi, .map-peek,
.qr-ctx, .proof, .fallback, .parsed, .reassure, .tier, .intent {
  background: var(--dial-2); border: 1px solid var(--dial-line);
  border-radius: var(--r); padding: var(--u5); box-shadow: none;
}
.surf-sunk { background: var(--dial); border: 1px solid var(--dial-line); border-radius: var(--r); padding: var(--u4); }
.surf-flat { background: none; border: 0; border-radius: 0; padding: 0; }

/* ---------- 5 · controls · filled acts, hairline offers, bare navigates ---------- */
.btn, .b, .slot-btn, .start-tile {
  display: flex; align-items: center; justify-content: center; gap: var(--u2);
  min-height: 52px; padding-inline: var(--u5);
  border-radius: var(--rp); font: 500 15px/1 var(--disp);
  border: 1px solid transparent; cursor: pointer; text-align: center;
  background: var(--ink); color: var(--dial-2);
  transition: transform .14s cubic-bezier(.2,.7,.3,1), background .16s ease;
}
.btn, .b { width: 100%; }
.btn:active, .b:active { transform: scale(.985); }
.btn svg, .b svg { width: 17px; height: 17px; }

.btn--2, .b-s, .slot-btn, .start-tile { background: transparent; color: var(--ink); border-color: var(--dial-line); }
.btn--3, .b-g { background: none; color: var(--jade); border-color: transparent; font-weight: 500; min-height: 44px; }
.btn--wa, .b-wa, .btn-wa { background: var(--wa); color: #fff; font-weight: 600; border-color: transparent; }
.btn--danger { background: var(--alarm); color: #fff; border-color: transparent; }
/* A button is aimed at deliberately, so for buttons the visual size SHOULD
   be the hit size — raise the small variant rather than hiding an invisible
   extender behind it. 40 -> 44 is imperceptible. */
.btn--sm, .b-sm, .btn-sm { min-height: 44px; font-size: 12.5px; padding-inline: var(--u4); }
.btn[disabled], .b[disabled] { opacity: .35; pointer-events: none; }
.btn-row { display: flex; gap: var(--u2); }
.btn-row > * { flex: 1; }

.icon-btn {
  display: grid; place-items: center; flex: none;
  width: 48px; height: 48px; border-radius: var(--rp);
  border: 1px solid var(--dial-line); color: var(--ink); background: transparent;
}
.icon-btn svg { width: 19px; height: 19px; }
.clear-btn { display: grid; place-items: center; width: 36px; height: 36px; flex: none; color: var(--ink-3); min-height: 36px; }
.clear-btn svg { width: 15px; height: 15px; }

/* ---------- 6 · chips ---------- */
.chip, .c, .pchip, .place-tag, .cred {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 0 14px; border-radius: var(--rp);
  border: 1px solid var(--dial-line);
  font: 400 13px/1 var(--disp); color: var(--ink-2);
  white-space: nowrap; background: transparent;
  transition: background .15s, border-color .15s, color .15s;
}
.chip svg, .c svg { width: 14px; height: 14px; }
.chip.on, .c-on { background: var(--ink); border-color: var(--ink); color: var(--dial-2); font-weight: 500; }
.c-off, .chip--off { opacity: .34; pointer-events: none; }
.chips { display: flex; gap: var(--u2); overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips--wrap { flex-wrap: wrap; overflow: visible; }

/* ---------- 7 · status · text carries it, colour only confirms ---------- */
.st, .chip--meta, .state-line, .cnt, .dist, .updated, .fee, .fresh, .bdg, .status-strip {
  display: inline-flex; align-items: center; gap: 6px;
  font: 500 11.5px/1.6 var(--disp); color: var(--ink-3);
  background: none; border: 0; padding: 0; border-radius: 0; min-height: 0;
}
.st-t, .chip--time, .chip--warn, .state-open, .state-soon, .bdg-n, .bdg-t, .fresh-warm { color: var(--brass-ink); }
.st-v, .chip--ok, .seal, .stamped, .bdg-v, .bdg-stock, .fresh-hot, .tr-yes { color: var(--jade); }
.st-e, .sos, .bdg-e, .tr-no { color: var(--alarm); }
.st-q, .state-shut, .unverified, .fresh-cold { color: var(--ink-3); }

.dot, .bulb, .fresh-dot { width: 5px; height: 5px; border-radius: var(--rp); background: currentColor; flex: none; }
.dot-live, .fresh-dot-live { animation: br 2.6s ease-in-out infinite; }
@keyframes br { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
@media (prefers-reduced-motion: reduce) { .dot-live, .fresh-dot-live { animation: none; } }

/* Verification is a struck mark, never a blue tick. */
.mark, .seal--stamp, .seal--pill {
  width: 34px; height: 34px; flex: none; border-radius: var(--rp);
  border: 1px solid var(--jade); display: grid; place-items: center;
  color: var(--jade); font: 600 9px/1 var(--disp);
}
.seal svg, .mark svg { width: 13px; height: 13px; }

/* ---------- 8 · avatars · a monogram engraved into the dial ---------- */
.av, .avatar, .qc-av, .prof-avatar, .dp-avatar, .ic, .intent-ic {
  width: 44px; height: 44px; flex: none; border-radius: var(--rp);
  display: grid; place-items: center;
  font: 400 17px/1 var(--disp); color: var(--ink-2);
  background: transparent; border: 1px solid var(--dial-line); position: relative;
}
.av::after, .avatar::after, .qc-av::after { content: ""; position: absolute; inset: -4px; border-radius: var(--rp); border: 1px solid var(--dial-line-2); }
.avatar--sq, .ic, .intent-ic { border-radius: var(--r); }
.avatar--sq::after, .ic::after { content: none; }
.avatar svg, .ic svg, .intent-ic svg { width: 20px; height: 20px; }
.prof-avatar { width: 56px; height: 56px; font-size: 21px; }

/* ---------- 9 · the band · time as an engraved arc, not a chunky bar ---------- */
.band, .ribbon, .bar-t, .bar {
  position: relative; height: 3px; background: var(--dial-line);
  border-radius: var(--rp); display: block;
}
.band > i, .bar-t > i, .bar-f { position: absolute; top: 0; bottom: 0; border-radius: var(--rp); }
.band .sh, .bar-f { background: var(--jade); }
.band .cl, .bar-f-a { background: var(--brass); }
.ribbon { overflow: visible; }
.ribbon > i { position: absolute; top: 0; bottom: 0; border-radius: var(--rp); inset-inline-start: var(--a); width: var(--w); background: var(--jade); }
.ribbon > i.priv, .ribbon > i.live { background: var(--brass); }
.nowmk, .ribbon > b { position: absolute; top: -5px; bottom: -5px; width: 1.5px; background: var(--ink); inset-inline-start: var(--now); border-radius: 0; }
.bar-t { overflow: hidden; }
.bar-r { display: grid; grid-template-columns: 92px 1fr 46px; gap: var(--u3); align-items: center; font-size: 12px; }
.bar-v { text-align: left; }
.bars { display: grid; gap: var(--u2); }

/* The tick rule — the identity motif. Engraved 24h measurement. */
.ticks { display: flex; align-items: flex-end; gap: 0; height: 16px; }
.ticks > i { flex: 1; height: 5px; background: var(--dial-line); border-radius: 0; }
.ticks > i.maj { height: 11px; background: var(--ink-4); }
.ticks > i.on { height: 16px; background: var(--brass); width: 2px; flex: none; margin-inline: 1px; }
/* The board sets .axis to direction:ltr while .ticks and .band inherit RTL and
   position with inset-inline-start — so the scale ran 00→24 left-to-right while
   the marks it labelled ran right-to-left. The product's established rule is
   that time mirrors the reading direction, so the axis is the piece that was
   wrong. Corrected here rather than in the identity file, which stays as the
   board shipped it. */
.axis, .ribbon-scale {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 10px; font-weight: 400;
  font-variant-numeric: tabular-nums; color: var(--ink-3);
  direction: inherit;
}
.axis > * { direction: ltr; unicode-bidi: embed; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 42px; }
.spark > i { flex: 1; background: var(--dial-line); border-radius: 1px; min-height: 2px; }
.spark > i.hi { background: var(--brass); }

/* ---------- 10 · shell ---------- */
.hdr {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: var(--u3);
  min-height: 60px; padding: var(--u3) var(--u5);
  padding-top: calc(var(--u3) + env(safe-area-inset-top));
  background: var(--dial); border-bottom: 1px solid transparent;
}
.hdr.stuck { border-bottom-color: var(--dial-line-2); }
.hdr-title { font: 500 15px/1.4 var(--disp); }
.hdr-back { width: 44px; height: 44px; }
.brand { display: flex; align-items: center; gap: var(--u2); font: 600 19px/1 var(--disp); letter-spacing: -.02em; min-height: 44px; }
.brand-mark { width: 24px; height: 24px; }

.nav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 50;
  display: flex; border-top: 1px solid var(--dial-line); background: var(--dial-2);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav a, .nv > span {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: var(--u3) 0 var(--u4); min-height: 56px;
  font: 400 12px/1 var(--disp); color: var(--ink-3); position: relative;
}
.nav a svg { width: 20px; height: 20px; }
.nav a.on, .nv > span.on { color: var(--ink); font-weight: 600; }
.nav a.on::before, .nv > span.on::before {
  content: ""; position: absolute; top: -1px; inset-inline: 32%; height: 2px; background: var(--ink);
}

.actionbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 55;
  display: flex; gap: var(--u2); padding: var(--u3) var(--u5);
  padding-bottom: calc(var(--u3) + env(safe-area-inset-bottom));
  background: var(--dial); border-top: 1px solid var(--dial-line);
}
.actionbar .btn { flex: 1; }

/* ---------- 11 · the sheet · the ONLY shadow in the product ---------- */
.sheet {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 90;
  max-height: 88dvh; overflow-y: auto;
  background: var(--dial-2); border-radius: 22px 22px 0 0;
  box-shadow: var(--float);
  padding: var(--u5) var(--u5) var(--u6);
  padding-bottom: calc(var(--u6) + env(safe-area-inset-bottom));
}
.sheet-grip, .grip { width: 32px; height: 3px; border-radius: var(--rp); background: var(--ink-4); margin: 0 auto var(--u5); }
.sheet-h { margin-bottom: var(--u5); }
.sheet-h h2 { font: 500 19px/1.45 var(--disp); letter-spacing: -.01em; }
.sheet-h p { margin-top: 4px; }
.sheet-f { margin-top: var(--u5); }
.scrim { position: fixed; inset: 0; z-index: 85; background: rgba(11,20,18,.44); }

/* ---------- 12 · the slip · a receipt, not a chat bubble ---------- */
.slip-h { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--u3); }
.slip-ref { font-family: var(--mono); font-size: 12px; background: var(--ink); color: var(--dial-2); border-radius: 5px; padding: 2px 8px; }
.slip-to { font: 400 11.5px/1.6 var(--disp); color: var(--ink-3); margin-top: var(--u3); border-top: 1px solid var(--dial-line-2); padding-top: var(--u3); }
.bubble, .msg-pre {
  font: 400 14.5px/2.05 var(--disp); white-space: pre-wrap; word-break: break-word;
  margin-top: var(--u3); background: none; border: 0; padding: 0; border-radius: 0;
}
.bubble--edit { border: 1px solid var(--jade); border-radius: var(--r); padding: var(--u3); }
.slip-edit { display: inline-flex; align-items: center; gap: 5px; font: 500 12px/1 var(--disp); color: var(--jade); margin-top: var(--u3); min-height: 44px; }
.slip-edit svg { width: 14px; height: 14px; }

/* ---------- 13 · fields ---------- */
/* A labelled field is a stack, not a row: putting the label beside the input
   at 390px leaves neither enough width and they overlap. */
.field { display: block; margin-top: var(--u4); background: none; border: 0; padding: 0; }
.field label {
  display: block; margin-bottom: 7px;
  font: 500 10.5px/1.5 var(--disp); letter-spacing: .2em;
  color: var(--ink-3); text-transform: uppercase;
}
.field input, .field textarea {
  width: 100%; min-height: 52px; padding: 0 var(--u4);
  border: 1px solid var(--dial-line); border-radius: var(--rp);
  background: var(--dial-2); font: 300 15px/1.6 var(--disp);
}
.field textarea { padding: var(--u3) var(--u4); line-height: 1.8; resize: vertical; }
.field input::placeholder, .field textarea::placeholder { color: var(--ink-4); }

.search-field {
  display: flex; align-items: center; gap: var(--u2);
  min-height: 52px; padding: 0 var(--u4); border-radius: var(--rp);
  border: 1px solid var(--dial-line); background: var(--dial-2);
}
.search-field input { flex: 1; min-width: 0; font: 300 15px/1.6 var(--disp); border: 0; background: none; padding: 0; }
.search-field > svg { width: 18px; height: 18px; color: var(--ink-3); }

/* Time slots: a vertical list of choices, each a wide control that states the
   day, the place and the fee on one line and the hours on the other. */
.slot { display: grid; gap: var(--u2); }
.slot-btn {
  display: flex; align-items: center; justify-content: space-between; gap: var(--u3);
  width: 100%; min-height: 60px; padding: var(--u3) var(--u4);
  border: 1px solid var(--dial-line); border-radius: var(--r);
  background: transparent; color: var(--ink); text-align: start;
}
.slot-btn.on { border-color: var(--ink); background: var(--dial-2); }
.slot-btn .d { display: block; font: 500 14px/1.4 var(--disp); }
.slot-btn .m { display: block; font: 400 11.5px/1.5 var(--disp); color: var(--ink-3); }
.slot-btn .t { font-family: var(--num); font-variant-numeric: tabular-nums; direction: ltr; flex: none; font-size: 13px; }

/* ---------- 14 · notes and banners · a rule and a colour, not a tinted box ---------- */
.note, .banner {
  display: flex; gap: var(--u3); align-items: flex-start;
  padding: var(--u4); border-radius: var(--r);
  font: 300 13.5px/1.8 var(--disp); color: var(--ink-2);
  background: none; border: 1px solid var(--dial-line);
}
.note svg, .banner svg { width: 17px; height: 17px; flex: none; margin-top: 3px; }
.note-w, .banner--warn { border-color: var(--brass-ink); color: var(--brass-ink); }
.note-e, .banner--stop { border-color: var(--alarm); color: var(--alarm); }

/* ---------- 15 · empty · offline · error ----------
   The failure states carry the same craft as the hero. */
.empty { text-align: center; padding: var(--u7) var(--u5); }
.empty-t, .empty h3 { font: 500 19px/1.45 var(--disp); letter-spacing: -.01em; margin-top: var(--u5); }
.empty-b, .empty p { margin-top: 6px; }
.empty-alts { margin-top: var(--u5); text-align: start; }
.empty .btn { margin-top: var(--u5); }

/* The dial glyph: concentric rings, a crosshair, and one brass point off
   centre. Pure CSS — a dead end costs nothing to draw. */
.glyph, .empty-mark {
  width: 96px; height: 96px; margin: 0 auto; position: relative;
  background: none; border: 0; border-radius: 0; color: transparent;
}
.empty-mark > svg { display: none; }
.glyph::before, .empty-mark::before {
  content: ""; position: absolute; inset: 0; border: 1px solid var(--dial-line); border-radius: var(--rp);
}
.glyph::after, .empty-mark::after {
  content: ""; position: absolute; inset: 28px; border: 1px solid var(--ink-4); border-radius: var(--rp);
}
.glyph > i { position: absolute; inset: 14px; border: 1px solid var(--dial-line); border-radius: var(--rp); transform: none; opacity: 1; }
.glyph > i:nth-child(2) { inset: 50% 0 auto 0; height: 1px; border: 0; background: var(--dial-line); border-radius: 0; }
.glyph > i:nth-child(3) { inset: 0 auto 0 50%; width: 1px; height: auto; border: 0; background: var(--dial-line); border-radius: 0; }
.glyph > b {
  position: absolute; top: 22px; inset-inline-end: 20px; inset-inline-start: auto; inset-block-end: auto;
  width: 7px; height: 7px; background: var(--brass); border-radius: var(--rp); transform: none;
}

.offline-bar, .netbar {
  display: flex; align-items: center; gap: var(--u3);
  padding: var(--u3) var(--u5); font: 300 12.5px/1.7 var(--disp);
  color: var(--ink-2); border-bottom: 1px solid var(--dial-line);
  background: var(--dial-2);
}
.offline-bar button { flex: none; min-height: 40px; padding: 0 14px; border-radius: var(--rp); border: 1px solid var(--dial-line); font-size: 12px; font-weight: 500; }

/* ---------- 16 · skeleton · the dial breathes, it does not shimmer ---------- */
.skel, .sk { background: var(--dial-line-2); border-radius: 3px; animation: pl 1.8s ease-in-out infinite; }
@keyframes pl { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .skel, .sk { animation: none; } }

/* ---------- 17 · numerals · the number is the largest thing, not the title ---------- */
.nbig, .kpi-n, .intent-n, .tier-p {
  font: 300 46px/1 var(--num); font-variant-numeric: tabular-nums;
  direction: ltr; unicode-bidi: embed; letter-spacing: -.03em;
}
.nhuge { font: 200 76px/.92 var(--num); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: embed; letter-spacing: -.045em; display: inline-block; }
.nbig, .kpi-n, .intent-n, .tier-p { display: inline-block; }
.adm-kpi .n { font: 300 34px/1 var(--num); font-variant-numeric: tabular-nums; direction: ltr; }
.kpi-d { font-size: 11.5px; color: var(--jade); font-weight: 500; }
.kpi-d-warn, .kpi-d-neg { color: var(--brass-ink); font-size: 11.5px; font-weight: 500; }

/* ---------- 18 · motion ---------- */
.page-in { animation: fi .17s cubic-bezier(.2,.7,.3,1) both; }
@keyframes fi { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .page-in { animation: none; } }

/* ---------- 19 · desktop · a measuring tool has a fixed scale ----------
   Beyond 560px the column stops and the dial sits on the paper rather than
   smearing across it. */
@media (min-width: 560px) {
  .app { max-width: 560px; margin-inline: auto; border-inline: 1px solid var(--dial-line); }
  .nav, .actionbar, .sheet { max-width: 560px; margin-inline: auto; }
}

/* ---------- 20 · hit size is not visual size ----------
   The identity sets chips at 36px, bare links at their line box, and small
   buttons at 40px. That is the right LOOK — inflating everything to 44px
   turns a dense chip row into a stack of lozenges and loses the instrument.
   But a 23px tap target is a real failure, especially one-handed on a bus.

   So the two are separated completely: the visual box is whatever the design
   says, and an inert ::after extends the hit area to 44px, centred. Nothing
   moves. This is why there is no `min-height: 44px` sprayed across anchors —
   that approach fought the layout and lost, silently, wherever a more
   specific rule reset it back to 0.
   ============================================================ */
:where(a[href], button, input, [onclick]) { position: relative; }
:where(a[href], button, input, [onclick])::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  height: 44px; width: 100%; min-width: 44px;
  pointer-events: none;
}
/* Controls already tall enough do not need it, and an extra invisible box
   only confuses hit-testing at their edges. */
.btn::after, .b::after, .icon-btn::after, .nav a::after, .slot-btn::after,
.rw::after, .card::after, .lane::after, .place::after, .need::after,
.qc::after, .start-tile::after, .field::after, .search-field::after,
.av::after, .avatar::after, .qc-av::after { content: none; }
.av::after, .avatar::after, .qc-av::after { content: ""; }

input, textarea { min-height: 44px; }
.icon-btn, .clear-btn { min-width: 44px; min-height: 44px; }
.clear-btn { width: 44px; height: 44px; }

/* ---------- 23 · the results header ----------
   Renamed from .n, which collided with the identity's numeral class: .n sets
   direction:ltr, and applying it to a container of Arabic text flipped the
   whole line, stranding the count on the wrong side. The numeral inside still
   gets .num; the line itself must stay RTL. */
.res-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--u3); padding: var(--u5) var(--u5) var(--u3); flex-wrap: wrap; }
.res-n { font: 500 13px/1.6 var(--disp); color: var(--ink); }
.res-n .why { color: var(--ink-3); font-weight: 400; }

</style>

  <script>
/* ============================================================
   QAREEB — قريب
   Seed data. Illustrative only.
   All phone / WhatsApp numbers are deliberate placeholders
   (9647700000xxx) and must be replaced before any launch.
   ============================================================ */

const CONFIG = {
  brand: { ar: "قريب", en: "Qareeb" },
  city: { ar: "بغداد", en: "Baghdad" },
  currency: { ar: "د.ع", en: "IQD" },
  /* Verified July 2026. Iraq consolidated 26 emergency lines behind a unified
     911 (Ministry of Interior; Baghdad 2024, nationwide by mid-2025), which
     dispatches police, fire and medical. The Ministry of Health ambulance line
     122 stays live alongside it. We lead with 911 because that is what the
     state is telling people to call, and keep 122 because a lot of Baghdad
     still dials it by muscle memory — both connect. Re-check before launch:
     an emergency number is the one piece of data here that can cost a life if
     it goes stale. */
  emergency: { unified: "911", ambulance: "122", verified_ar: "تموز ٢٠٢٦", verified_en: "July 2026" },
  /* Show a stack trace on the error screen only when explicitly enabled.
     A user never needs it; whoever is debugging a poster in the field does. */
  debug: false,
  /* Anchored to the consultation fee already in this dataset: at a 30,000 IQD
     consultation, two extra patients a month clears it. That is the argument
     the tier card makes out loud, so a doctor can check it against their own
     week instead of being asked to trust a number. Indicative until signed. */
  partnerPrice: 45000,
  defaultDistrict: "karrada",
  radiusKm: 5,
  radiusSteps: [5, 10, 25],
};

/* ---------- DISTRICTS (Baghdad) ---------- */

   not "which doctor" (a few times a year, and IRAQDR/Doctoury already serve
   it) but "who has this medicine right now" — a weekly, painful hunt caused
   by chronic shortages. Nobody structures that. This is the wedge.

   `stock` records WHICH pharmacy last confirmed it and HOW LONG AGO. The
   freshness is the whole point: a two-day-old confirmation is worth calling,
   a two-month-old one is not.
------------------------------------------------------------------------- */

   claim to know a shelf; we know that someone confirmed availability at a

  <path d="M4 4h18l6 6v18H4z" fill="var(--petrol)"/>
  <path d="M16 22.5c-4.2-3-6.6-5.2-6.6-8a3.4 3.4 0 0 1 6.6-1.2 3.4 3.4 0 0 1 6.6 1.2c0 2.8-2.4 5-6.6 8z" fill="var(--amber-b)"/>
</svg>`;

/* ---------------- TIME ENGINE ---------------- */
const mins = (hm) => { const [h, m] = hm.split(":").map(Number); return h * 60 + m; };
const nowDate = () => (S.demoTime ? new Date(S.demoTime) : new Date());
const nowMins = () => { const d = nowDate(); return d.getHours() * 60 + d.getMinutes(); };
const nowDay = () => nowDate().getDay();
const pct = (m) => (m / 1440) * 100;
// 24-hour everywhere: it aligns in a column, and it contains no letters, so an
// Arabic RTL line can never reorder it. 12h + ص/ظ/م inside an LTR run gets mangled.
const fmtT = (m) => {
  const h = Math.floor((m % 1440) / 60), mm = m % 60;
  return `${String(h).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
};
const fmtRangeTxt = (a, b) => `${fmtT(a)} – ${fmtT(b)}`;                       // plain text: messages, stored records
const fmtRange = (a, b) => `<span dir="ltr" class="num">${fmtRangeTxt(a, b)}</span>`;   // markup: UI
const fmtTi = (m) => `<span dir="ltr" class="num">${fmtT(m)}</span>`;

/* raw segments on a weekday; t may exceed 1440 when it wraps past midnight */
function rawSegs(ent, day) {
  const out = [];
  if (ent.sessions) {
    ent.sessions.filter((s) => s.d === day).forEach((s) => {
      const f = FACILITIES.find((x) => x.id === s.fac);
      out.push({ f: mins(s.f), t: mins(s.t), kind: f && f.type === "hospital" ? "pub" : "priv", s, fac: f });
    });
  } else if (ent.always) {
    out.push({ f: 0, t: 1440, kind: "priv" });
  } else if (ent.hours) {
    ent.hours.forEach((h) => {
      if (h.d !== "all" && h.d !== "wk" && h.d !== day) return;
      if (h.d === "wk" && (day === 5)) return;         // Friday closed for weekday-only facilities
      let a = mins(h.f), b = h.t === "24:00" ? 1440 : mins(h.t);
      if (b <= a) b += 1440;
      out.push({ f: a, t: b, kind: "priv" });
    });
  }
  return out.sort((x, y) => x.f - y.f);
}

function openSeg(ent) {
  const d = nowDay(), n = nowMins();
  for (const s of rawSegs(ent, d)) if (n >= s.f && n < s.t) return s;
  for (const s of rawSegs(ent, (d + 6) % 7)) if (n + 1440 >= s.f && n + 1440 < s.t) return { ...s, f: s.f - 1440, t: s.t - 1440 };
  return null;
}

function nextSeg(ent) {
  const d0 = nowDay(), n = nowMins();
  for (let i = 0; i < 8; i++) {
    const d = (d0 + i) % 7;
    for (const s of rawSegs(ent, d)) {
      const abs = i * 1440 + s.f;
      if (abs > n) return { ...s, day: d, inDays: i, abs };
    }
  }
  return null;
}

function status(ent) {
  const o = openSeg(ent);
  if (o) return { k: o.t - nowMins() <= 45 ? "soon" : "open", seg: o };
  const nx = nextSeg(ent);
  return { k: "shut", next: nx };
}

function statusLabel(st, terse = false) {
  if (st.k === "open") return `<span class="state-line state-open"><i class="bulb"></i>${t("openNow")}${terse ? "" : ` · ${t("until")} ${fmtTi(st.seg.t)}`}</span>`;
  if (st.k === "soon") return `<span class="state-line state-soon"><i class="bulb"></i>${t("closingSoon")} ${fmtTi(st.seg.t)}</span>`;
  if (!st.next) return `<span class="state-line state-shut"><i class="bulb"></i>${t("closed")}</span>`;
  const when = st.next.inDays === 0 ? t("today") : st.next.inDays === 1 ? t("tomorrow") : dayName(st.next.day);
  return `<span class="state-line state-shut"><i class="bulb"></i>${t("opensAt")} ${when} ${fmtTi(st.next.f)}</span>`;
}

/* ---------------- THE WEEK STRIP (signature) ----------------
   Seven cells, Saturday-first like the Iraqi week. State is carried by fill
   AND shape — filled = working, hollow = not, today is ringed, the next open
   day is dotted. Never colour alone.
------------------------------------------------------------- */
const DAY_LETTER = { 6: "س", 0: "ح", 1: "ن", 2: "ث", 3: "ر", 4: "خ", 5: "ج" };
function weekStrip(ent) {
  const today = nowDay();
  const nx = status(ent).next;
  const cells = DAY_ORDER.map((d) => {
    const works = rawSegs(ent, d).length > 0;
    const isToday = d === today;
    const isNext = nx && nx.day === d && !isToday;
    return `<span class="wk7-d${works ? " on" : " off"}${isToday ? " today" : ""}${isNext ? " next" : ""}"
      title="${dayName(d)}">${DAY_LETTER[d]}</span>`;
  }).join("");
  return `<div class="wk7" role="img" aria-label="${isAR() ? "أيام الدوام خلال الأسبوع" : "Days open this week"}">${cells}</div>`;
}

/* ---------------- RIBBON ---------------- */
function ribbon(ent, day = null, cls = "ribbon--micro", showNow = true) {
  const d = day === null ? nowDay() : day;
  const segs = rawSegs(ent, d);
  const prev = rawSegs(ent, (d + 6) % 7).filter((s) => s.t > 1440).map((s) => ({ ...s, f: 0, t: s.t - 1440 }));
  const all = [...prev, ...segs];
  const st = status(ent);
  const bars = all.map((s) => {
    const a = Math.max(0, s.f), b = Math.min(1440, s.t);
    if (b <= a) return "";
    const live = showNow && day === null && st.k !== "shut" && st.seg && s.f === st.seg.f;
    return `<i class="${s.kind}${live ? " live" : ""}" style="--a:${pct(a).toFixed(2)}%;--w:${pct(b - a).toFixed(2)}%"></i>`;
  }).join("");
  const marker = showNow && (day === null || day === nowDay()) ? `<b style="--now:${pct(nowMins()).toFixed(2)}%"></b>` : "";
  return `<div class="ribbon ${cls}" role="img" aria-label="${t("sessions")}">${bars}${marker}</div>`;
}

function ribbonScale() {
  return `<div class="ribbon-scale">${[6, 12, 18].map((h) =>
    `<span style="--a:${pct(h * 60)}%">${String(h).padStart(2, "0")}:00</span>`).join("")}</div>`;
}

/* ---------------- GEO ---------------- */
const R = 6371;
function haversine(a, b) {
  const dLat = ((b.lat - a.lat) * Math.PI) / 180, dLng = ((b.lng - a.lng) * Math.PI) / 180;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos((a.lat * Math.PI) / 180) * Math.cos((b.lat * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
const here = () => DISTRICTS.find((d) => d.id === S.district) || DISTRICTS[0];
const fac = (id) => FACILITIES.find((f) => f.id === id);
function distTo(f) { return haversine(here(), f); }
// Approximation is stated once, in the results header — not repeated on every card.
// Repeating "~" on 30 cards is noise, and a stray tilde is a bidi hazard in RTL.
function fmtKm(k) {
  const n = k < 1 ? Math.round(k * 1000) : k.toFixed(1);
  const u = k < 1 ? (isAR() ? "م" : "m") : t("km");
  return `<span class="num">${n}</span> ${u}`;
}
const approxNote = () => S.locState === "precise" ? "" :
  (isAR() ? `المسافات تقريبية من مركز ${L(here())}` : `Distances approximate from ${L(here())} centre`);
function docDist(doc) {
  const ds = doc.sessions.map((s) => distTo(fac(s.fac))).filter((n) => !isNaN(n));
  return ds.length ? Math.min(...ds) : 99;
}
function docFacs(doc) { return [...new Set(doc.sessions.map((s) => s.fac))].map(fac); }

/* ---------------- SELECTORS ---------------- */
function doctorsFor({ spec = null, q = null, radius = S.radius } = {}) {
  let list = DOCTORS.slice();
  if (spec) list = list.filter((d) => d.spec === spec);
  if (q) { const nq = norm(q); list = list.filter((d) => norm(d.ar + " " + d.en + " " + (d.sub_ar || "")).includes(nq) || specMatch(d.spec, nq)); }
  const f = S.filters;
  if (f.gender) list = list.filter((d) => d.gender === f.gender);
  if (f.openNow) list = list.filter((d) => status(d).k !== "shut");
  if (f.when === "today")    list = list.filter((d) => rawSegs(d, nowDay()).some((sg) => sg.t > nowMins()));
  if (f.when === "tomorrow") list = list.filter((d) => rawSegs(d, (nowDay() + 1) % 7).length > 0);
  if (f.when === "week")     list = list.filter((d) => { const n = nextSeg(d); return n && n.inDays <= 6; });
  if (f.fee === "free")  list = list.filter((d) => d.sessions.some((sg) => sg.fee === 0));
  if (f.fee === "u25")   list = list.filter((d) => d.sessions.some((sg) => sg.fee !== null && sg.fee > 0 && sg.fee <= 25000));
  if (f.facType) list = list.filter((d) => docFacs(d).some((x) => x && (f.facType === "hospital" ? x.type === "hospital" : x.type !== "hospital")));
  if (f.district) list = list.filter((d) => docFacs(d).some((x) => x && x.district === f.district));
  list = list.map((d) => ({ d, km: docDist(d), st: status(d) }));
  const within = list.filter((x) => x.km <= radius);
  const thin = within.length < 3;                 // widen when results are thin, not only when empty
  const used = thin ? list : within;
  const usedRadius = thin ? null : radius;
  // Sort by WHEN, not by how far. A doctor open now outranks a nearer one who
  // opens on Thursday; distance only breaks ties between equal availability.
  const waitOf = (x) => x.st.k !== "shut" ? -1 : (x.st.next ? x.st.next.abs - nowMins() : 1e9);
  used.sort((a, b) => waitOf(a) - waitOf(b) || a.km - b.km);
  return { list: used, expanded: usedRadius === null, total: list.length };
}

function pharmaciesNear({ openOnly = false, radius = 25 } = {}) {
  let list = FACILITIES.filter((f) => f.type === "pharmacy").map((f) => ({ f, km: distTo(f), st: status(f) }));
  if (openOnly) list = list.filter((x) => x.st.k !== "shut");
  list = list.filter((x) => x.km <= radius);
  list.sort((a, b) => {
    const rank = (x) => (x.st.k === "open" ? 0 : x.st.k === "soon" ? 1 : 2);
    return rank(a) - rank(b) || a.km - b.km;
  });
  return list;
}

const norm = (s) => (s || "").toString().toLowerCase()
  .replace(/[ً-ٰٟ]/g, "").replace(/[أإآٱ]/g, "ا")
  .replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/ـ/g, "").trim();

function specMatch(id, nq) {
  const sp = SPECIALTIES.find((s) => s.id === id);
  if (!sp) return false;
  return [sp.ar, sp.en, ...sp.alias].some((a) => norm(a).includes(nq) || nq.includes(norm(a)));
}
function findSpecByQuery(q) {
  const nq = norm(q); if (!nq) return null;
  return SPECIALTIES.find((s) => [s.ar, s.en, ...s.alias].some((a) => norm(a).includes(nq) || nq.includes(norm(a)))) || null;
}
const specOf = (id) => SPECIALTIES.find((s) => s.id === id);
const needCount = (n) => DOCTORS.filter((d) => d.spec === n.spec && status(d).k !== "shut").length;
const docsOpenNow = () => DOCTORS.filter((d) => status(d).k !== "shut").length;
const phOpenNow = () => FACILITIES.filter((f) => f.type === "pharmacy" && status(f).k !== "shut").length;
const phNight = () => FACILITIES.filter((f) => f.type === "pharmacy" && f.night).length;

/* ---------------- HELPERS ---------------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// An unknown fee is omitted by the caller. This never invents certainty.
const money = (n) => (n === null || n === undefined) ? "" : n === 0 ? t("free") : `${n.toLocaleString("en-US")} ${L(CONFIG.currency)}`;
const initials = (name) => {
  const clean = name.replace(/^د\.\s*/, "").replace(/^Dr\.\s*/, "").trim();
  // Arabic letters join into pseudo-words, so one letter reads better than two
  return isAR() ? clean[0] : clean.split(/\s+/).slice(0, 2).map((w) => w[0]).join("");
};
const refCode = () => { const C = "ABCDEFGHJKLMNPQRTUVWXY3479"; return Array.from({ length: 4 }, () => C[Math.floor(Math.random() * C.length)]).join(""); };
const waLink = (num, msg) => `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
const mapLink = (f) => `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}`;

function sealBadge(ent) {
  return ent.verified
    ? `<span class="seal">${icon("seal")}${t("verified")}</span>`
    : `<span class="unverified">${icon("info")}${t("listed")}</span>`;
}
function updatedLine(ent) {
  const stale = ent.updated > 90;
  return `<span class="updated${stale ? " stale" : ""}">${icon("refresh")}${t("updated")} <span class="num">${ent.updated}</span> ${t("days")}</span>`;
}

/* ---------------- CARDS ---------------- */
/* ---------------- v3 · THE TICK RULE ----------------
   The identity motif. Twenty-four engraved ticks, majors every four hours,
   and one brass tick for now. It replaces the ribbon at the top of a screen:
   the ribbon says "these are the open hours", the tick rule says "this is a
   measuring instrument and you are here on it".
------------------------------------------------------------- */
function ticks(nowM = nowMins()) {
  const h = Math.floor((nowM % 1440) / 60);
  return `<div class="ticks" role="img" aria-label="${isAR() ? "الساعة الآن" : "Current hour"} ${fmtT(nowM)}">${
    Array.from({ length: 24 }, (_, i) =>

const axis24 = () => `<div class="axis">00<span>06</span><span>12</span><span>18</span>24</div>`;

/* The band: one entity's day drawn as arc segments on a 3px rule. Jade is
   the hospital shift, brass the private clinic — the same two meanings the
   whole product uses, and nothing else is ever drawn here. */
function band(ent, day = null, showNow = true) {
  const d = day === null ? nowDay() : day;
  const segs = rawSegs(ent, d);
  const prev = rawSegs(ent, (d + 6) % 7).filter((x) => x.t > 1440).map((x) => ({ ...x, f: 0, t: x.t - 1440 }));
  const bars = [...prev, ...segs].map((x) => {
    const a = Math.max(0, x.f), b = Math.min(1440, x.t);
    if (b <= a) return "";
    return `<i class="${x.kind === "priv" ? "cl" : "sh"}" style="inset-inline-start:${pct(a).toFixed(2)}%;width:${pct(b - a).toFixed(2)}%"></i>`;
  }).join("");
  const mk = showNow && (day === null || day === nowDay())
    ? `<span class="nowmk" style="inset-inline-start:${pct(nowMins()).toFixed(2)}%"></span>` : "";
  return `<div class="band">${bars}${mk}</div>`;
}

/* ---------------- v3 · THE ROW ----------------
   Rows, not cards. The list is the surface: a hairline separates entries and

------------------------------------------------------------- */
function rowEl(o) {

function pharmacyCard(x, dimIfShut = true) {

const SVC = {
  delivery: { ar: "توصيل", en: "Delivery" }, night: { ar: "خفارة", en: "Night duty" },
  injections: { ar: "حقن وزرق", en: "Injections" }, bp: { ar: "قياس ضغط", en: "BP check" },

/* ---------------- QUERY UNDERSTANDING ----------------
   Iraqi users type intent, not keywords: "دكتورة اطفال بالكرادة اليوم" is four
   filters in one breath — specialty, gender, district, time. Text matching
   throws three of them away and returns a weak list.

   This parses the sentence into structured filters, then SHOWS what it
   understood as removable tokens. Transparency is the point: a search that
   silently guesses is untrustworthy; one that says "I read this as X, Y, Z —
   remove any of them" is a tool. No competitor in this market does it.
------------------------------------------------------------- */

/* Damerau-style distance, capped — phone typing on Arabic keyboards drops and
   swaps letters constantly. Only worth running on short tokens. */
function editDist(a, b, max = 2) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let cur = [i], best = i;
    for (let j = 1; j <= b.length; j++) {
      const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      cur[j] = v; if (v < best) best = v;
    }
    if (best > max) return max + 1;
    prev.length = 0; prev.push(...cur);
  }
  return prev[b.length];
}
const fuzzyHit = (token, target) => {
  const t = norm(target);
  if (!t || !token) return false;
  if (t.includes(token) || token.includes(t)) return true;
  return token.length >= 4 && editDist(token, t, token.length >= 7 ? 2 : 1) <= (token.length >= 7 ? 2 : 1);
};

// Arabic marks the feminine, never the masculine: "دكتور" is the neutral
// citation form. Reading it as "male" invents a filter the user never asked
// for — and in testing it returned zero results for a query that had answers.
const GENDER_WORDS = { f: ["طبيبه", "دكتوره", "دكتورة", "طبيبة", "female", "woman"] };
const TIME_WORDS   = ["اليوم", "هسه", "هلا", "الان", "حالا", "مفتوح", "مفتوحه", "دوام", "today", "now", "open"];
const KIND_WORDS   = {
  pharmacy: ["صيدليه", "صيدليات", "خفاره", "مناوبه", "pharmacy"],
  medicine: ["دواء", "دوا", "علاج", "حبوب", "ابره", "medicine", "drug"],
  product:  ["كريم", "شامبو", "واقي", "غسول", "فيتامين", "cream", "shampoo"],
};

function parseQuery(q) {
  const raw = norm(q);
  if (!raw) return null;
  const tokens = raw.split(/\s+/).filter(Boolean);
  const out = { spec: null, district: null, gender: null, openNow: false, kind: null, rest: [] };

  for (const tok of tokens) {
    if (tok.length < 2) continue;
    // gender first: "دكتورة" also fuzzy-matches "دكتور", so it must win
    let hit = false;
    for (const [g, words] of Object.entries(GENDER_WORDS)) {
      if (words.some((w) => norm(w) === tok)) { out.gender = g; hit = true; break; }
    }
    if (hit) continue;
    if (TIME_WORDS.some((w) => norm(w) === tok)) { out.openNow = true; continue; }
    const dis = DISTRICTS.find((d) => fuzzyHit(tok.replace(/^(ب|بال|ال)/, ""), d.ar) || fuzzyHit(tok, d.en));
    if (dis) { out.district = dis.id; continue; }
    const sp = SPECIALTIES.find((x) => [x.ar, x.en, ...x.alias].some((a) => fuzzyHit(tok, a)));
    if (sp) { out.spec = sp.id; continue; }
    for (const [k, words] of Object.entries(KIND_WORDS)) {
      if (words.some((w) => fuzzyHit(tok, w))) { out.kind = k; hit = true; break; }
    }
    if (!hit) out.rest.push(tok);
  }
  const understood = !!(out.spec || out.district || out.gender || out.openNow || out.kind);
  return understood ? out : null;
}

/* The tokens we understood, shown back as removable chips. */
function parsedChips(pq, q) {
  const chip = (label, key) =>
    `<button class="pchip" onclick="dropToken('${key}')">${esc(label)}${icon("close")}</button>`;
  const bits = [];
  if (pq.kind)     bits.push(chip({ pharmacy: isAR() ? "صيدليات" : "Pharmacies", medicine: isAR() ? "أدوية" : "Medicines", product: isAR() ? "منتجات" : "Products" }[pq.kind], "kind"));
  if (pq.spec)     bits.push(chip(L(specOf(pq.spec)), "spec"));
  if (pq.gender)   bits.push(chip(pq.gender === "f" ? (isAR() ? "طبيبة" : "Female") : (isAR() ? "طبيب" : "Male"), "gender"));
  if (pq.district) bits.push(chip(L(DISTRICTS.find((d) => d.id === pq.district)), "district"));
  if (pq.openNow)  bits.push(chip(isAR() ? "مفتوح الآن" : "Open now", "openNow"));
  if (!bits.length) return "";
  return `<div class="parsed">
    <div class="parsed-h">${icon("check")}${isAR() ? "فهمنا بحثك هكذا" : "We read your search as"}</div>
    <div class="chips chips--wrap">${bits.join("")}</div>
  </div>`;
}

/* An empty result is a dead end only if we make the user guess which
   constraint killed it. We already know: drop each token in turn, see which
   one restores results, and offer that exact fix as one tap. */
/* The board's empty mark: three rotated squares around an amber diamond. It is
   the app's own geometry rather than a generic magnifier or a shrugging doctor,
   and it is drawn in CSS so an empty state costs nothing to render. */
const emptyGlyph = () => `<div class="glyph" aria-hidden="true"><i></i><i></i><i></i><b></b></div>`;

function zeroWithWayOut(P) {
  const LABEL = {
    spec: () => L(specOf(P.spec)),
    district: () => L(DISTRICTS.find((d) => d.id === P.district)),
    gender: () => (P.gender === "f" ? (isAR() ? "طبيبة" : "female") : (isAR() ? "طبيب" : "male")),
    openNow: () => (isAR() ? "مفتوح الآن" : "open now"),
  };
  const rescues = [];
  for (const key of ["district", "openNow", "gender", "spec"]) {
    if (!P[key]) continue;
    const trial = { ...P, [key]: key === "openNow" ? false : null };
    const saved = { ...S.filters };
    S.filters = { ...S.filters, spec: trial.spec, gender: trial.gender, openNow: trial.openNow, district: trial.district };
    const n = doctorsFor({ spec: trial.spec }).list.length;
    S.filters = saved;
    if (n > 0) rescues.push({ key, n, label: LABEL[key]() });
  }
  rescues.sort((a, b) => b.n - a.n);
  return `<div class="empty">
    ${emptyGlyph()}
    <h3>${isAR() ? "ما لگينا أحد يجمع كل هذي الشروط" : "Nothing matches all of those at once"}</h3>
    ${rescues.length ? `<p>${isAR() ? "بس لو تتنازل عن وحدة:" : "But dropping one of them works:"}</p>
      <div class="empty-alts stack">${rescues.map((r) => `
        <button class="lane" onclick="dropToken('${r.key}')">
          <span class="ic">${icon("refresh")}</span>
          <span class="grow" style="text-align:start">
            <h3>${isAR() ? "بدون" : "Without"} «${esc(r.label)}»</h3>
            <p><b class="num">${r.n}</b> ${isAR() ? "نتيجة" : "results"}</p></span>
          ${icon("chev")}</button>`).join("")}</div>`
      : `<p>${isAR() ? "جرّب منطقة ثانية أو تصفّح الاختصاصات." : "Try another area, or browse specialties."}</p>
         <button class="btn btn--2" onclick="location.hash='#/needs'">${icon("grid")}${isAR() ? "تصفّح حسب الحاجة" : "Browse by need"}</button>`}
  </div>`;
}

function dropToken(key) {
  S.parsedDrop = S.parsedDrop || {};
  S.parsedDrop[key] = true;
  doSearch(LS.get("q", ""));
}

function applyParsed(pq) {
  const d = S.parsedDrop || {};
  return {
    spec: d.spec ? null : pq.spec,
    district: d.district ? null : pq.district,
    gender: d.gender ? null : pq.gender,
    openNow: d.openNow ? false : pq.openNow,
    kind: d.kind ? null : pq.kind,
  };
}

/* ---------------- P6 · DATA INTEGRITY ----------------
   A flat seed file fails silently: a typo in a facility id renders an empty
   block, a reversed time range renders a doctor as permanently closed, a
   duplicate id makes one record unreachable. None of it throws. For an
   operator product that curates thousands of rows, silent corruption is the
   most expensive class of bug there is — so validate at load and surface it.
------------------------------------------------------------- */
function validateData() {
  const errs = [];
  const seen = new Set();
  const facIds = new Set(FACILITIES.map((f) => f.id));
  const specIds = new Set(SPECIALTIES.map((x) => x.id));
  const distIds = new Set(DISTRICTS.map((d) => d.id));

  const dup = (id, kind) => { const k = kind + ":" + id; if (seen.has(k)) errs.push({ t: "dup", m: `${kind} ${id} مكرر` }); seen.add(k); };

  DISTRICTS.forEach((d) => { dup(d.id, "district"); if (!d.lm_ar) errs.push({ t: "missing", m: `المنطقة ${d.ar} بلا معلم` }); });
  FACILITIES.forEach((f) => {
    dup(f.id, "facility");
    if (!distIds.has(f.district)) errs.push({ t: "orphan", m: `${f.ar}: منطقة غير معروفة «${f.district}»` });
    (f.hours || []).forEach((h) => {
      if (h.t !== "24:00" && mins(h.t) === mins(h.f)) errs.push({ t: "time", m: `${f.ar}: دوام بطول صفر` });
    });
    if (f.type === "pharmacy" && !f.phone) errs.push({ t: "missing", m: `${f.ar}: بلا هاتف` });
  });
  DOCTORS.forEach((d) => {
    dup(d.id, "doctor");
    if (!specIds.has(d.spec)) errs.push({ t: "orphan", m: `${d.ar}: اختصاص غير معروف «${d.spec}»` });
    if (!d.sessions || !d.sessions.length) errs.push({ t: "empty", m: `${d.ar}: بلا أوقات دوام — لن يظهر` });
    (d.sessions || []).forEach((sg) => {
      if (!facIds.has(sg.fac)) errs.push({ t: "orphan", m: `${d.ar}: منشأة غير معروفة «${sg.fac}»` });
      if (mins(sg.t) <= mins(sg.f)) errs.push({ t: "time", m: `${d.ar}: نهاية الدوام قبل بدايته (${sg.f}–${sg.t})` });
      if (sg.d < 0 || sg.d > 6) errs.push({ t: "time", m: `${d.ar}: يوم غير صالح` });
    });
    if (!d.wa && !d.phone) errs.push({ t: "missing", m: `${d.ar}: بلا واتساب ولا هاتف — غير قابل للتواصل` });
  });
  const medIds = new Set(MEDICINES.map((m) => m.id));
  MEDICINES.forEach((m) => {
    dup(m.id, "medicine");
    m.stock.forEach((st) => {
      if (!facIds.has(st.f)) errs.push({ t: "orphan", m: `${m.ar}: صيدلية غير معروفة «${st.f}»` });
      /* A confirmation dated in the future, or a "price" of zero, would both
         render as confident facts. Catch them here rather than on screen. */
      if (freshMins(st) < 0) errs.push({ t: "range", m: `${m.ar}: تأكيد بتاريخ مستقبلي` });
      if (st.p !== undefined && !(st.p > 0)) errs.push({ t: "range", m: `${m.ar}: سعر غير صالح` });
    });
    /* The substitute door must open onto something. A dangling id would render
       a button that leads to a 404 on the screen where the user has the fewest
       options left — the worst possible place for a dead end. */
    (m.subs || []).forEach((sid) => {
      if (!medIds.has(sid)) errs.push({ t: "orphan", m: `${m.ar}: بديل غير معروف «${sid}»` });
      if (sid === m.id) errs.push({ t: "orphan", m: `${m.ar}: بديل يشير إلى نفسه` });
    });
    if (m.trend && m.trend.length !== 14) errs.push({ t: "range", m: `${m.ar}: سلسلة التوفّر ليست ١٤ يوماً` });
  });
  PRODUCTS.forEach((pr) => {
    dup(pr.id, "product");
    pr.stock.forEach((fid) => { if (!facIds.has(fid)) errs.push({ t: "orphan", m: `${pr.ar}: صيدلية غير معروفة «${fid}»` }); });
  });
  return errs;
}

/* ---------------- P4 · RESILIENCE ----------------
   Baghdad mobile data drops. The app must say so plainly and keep working on
   what it already has — the seed data is in memory, so discovery never dies.
   Only the WhatsApp handoff genuinely needs the network.
------------------------------------------------------------- */
function netBanner() {
  if (navigator.onLine !== false) return "";
  /* "Browsing still works" is only honest if we also say how old the answer is.
     Opening hours are computed live and stay true; stock confirmations were
     read at a point in time and may have moved since. Say which is which. */
  const at = LS.get("lastOnline", null);
  const when = at ? fmtT(new Date(at).getHours() * 60 + new Date(at).getMinutes()) : null;
  return `<div class="offline-bar">
    <span class="grow">${isAR()
      ? `${when ? `بيانات محفوظة من <span class="num">${when}</span>` : "دون اتصال"}<br><span class="t3">التوفّر قد يكون تغيّر · الاتصال الهاتفي يعمل</span>`
      : `${when ? `Saved data from <span class="num">${when}</span>` : "Offline"}<br><span class="t3">Stock may have changed · phone calls still work</span>`}</span>
    <span class="st st-q"><i class="dot"></i>${isAR() ? "محفوظ" : "saved"}</span>
    <button onclick="render()">${isAR() ? "إعادة" : "Retry"}</button></div>`;
}

/* ---------------- QR ENTRY ----------------
   Someone scans a poster at a pharmacy counter. They are standing up, probably
   holding a prescription, and they did not come here to be onboarded. So this
   is one question with three answers, every count computed live, and a skip
   that is always the first thing reachable. It is not a carousel: there is no
   second slide, and answering is optional — the district is already filled in
   from the poster, so leaving does not cost them anything.
------------------------------------------------------------- */
const qrSeen = () => LS.get("startSeen", []);

function markStartSeen(src) {
  const seen = qrSeen();
  if (src && !seen.includes(src)) LS.set("startSeen", [src, ...seen].slice(0, 12));
}

function skipStart() {
  markStartSeen(S.qrSource);
  location.hash = "#/";
}

function startTo(hash) {
  markStartSeen(S.qrSource);
  location.hash = hash;
}
