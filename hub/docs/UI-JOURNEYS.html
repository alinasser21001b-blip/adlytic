<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قريب — رحلات الواجهة · Qareeb Flow Journeys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- TWO FAMILIES, NOT THREE — the same decision the product itself made.
     Readex Pro carries Arabic display; IBM Plex Sans carries every numeral and,
     with tracking and tabular figures, every label a monospace face would have
     carried. This document practises what it documents. -->
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..600&family=IBM+Plex+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Tokens — copied VERBATIM from src/styles/identity.css.
   If they drift from that file, that file wins.
   ============================================================ */
:root{
  --case:#0B1412; --case-2:#101B18; --case-line:rgba(240,236,228,.14);
  --case-ink:#F2EFE8; --case-ink-2:rgba(242,239,232,.78); --case-ink-3:rgba(242,239,232,.64);
  --dial:#F4F1EB; --dial-2:#FBF9F5; --dial-line:rgba(11,20,18,.10); --dial-line-2:rgba(11,20,18,.055);
  --line-ctl:rgba(11,20,18,.50);
  --ink:#0B1412; --ink-2:rgba(11,20,18,.72); --ink-3:rgba(11,20,18,.64); --ink-4:rgba(11,20,18,.42);
  --jade:#0E5450; --jade-2:#14706A; --jade-lit:#5FD0C0;
  --brass:#C98A18; --brass-ink:#845A09; --brass-lit:#F0C15E;
  --alarm:#C1121F; --alarm-lit:#F08A80; --alarm-on:#fff;
  --wash-time:#F0E7D6; --wash-alarm:#F0E0DC;
  --disp:'Readex Pro',system-ui,sans-serif;
  --num:'IBM Plex Sans',system-ui,sans-serif;
  --r:12px; --rp:999px;
  --u1:4px;--u2:8px;--u3:12px;--u4:16px;--u5:20px;--u6:28px;--u7:40px;--u8:56px;--u9:72px;--u10:96px;
  --shadow:0 24px 60px -12px rgba(11,20,18,.42), 0 2px 6px rgba(11,20,18,.10);
  /* page surfaces — dark is the default, as the product's home screen is */
  --bg:var(--case); --bg2:var(--case-2); --surf:#151F1B; --surf2:#1A2622;
  --line:var(--case-line); --txt:var(--case-ink); --txt2:var(--case-ink-2); --txt3:var(--case-ink-3);
  --acc:var(--jade-lit); --alarm-c:var(--alarm-lit); --brass-c:var(--brass-lit);
}
[data-theme="light"]{
  --bg:var(--dial); --bg2:var(--dial-2); --surf:#fff; --surf2:#F7F4EE;
  --line:var(--dial-line); --txt:var(--ink); --txt2:var(--ink-2); --txt3:var(--ink-3);
  --acc:var(--jade); --alarm-c:var(--alarm); --brass-c:var(--brass-ink);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;}
body{font-family:var(--disp);background:var(--bg);color:var(--txt);line-height:1.7;overflow-x:hidden;
     transition:background .3s ease,color .3s ease;}
.container{max-width:1180px;margin-inline:auto;padding-inline:var(--u5);}
::selection{background:color-mix(in oklch, var(--acc) 30%, transparent);}

/* Numerals. Same rule as the product: isolate, tabular, never wrapping. */
.num{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;
     unicode-bidi:isolate;white-space:nowrap;font-weight:400;}
.mark{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.08em;font-weight:400;}

/* ===== TOP BAR ===== */
header.top{position:sticky;top:0;z-index:100;background:color-mix(in oklch, var(--bg) 82%, transparent);
           backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:var(--u2) var(--u5);
        max-width:1180px;margin-inline:auto;gap:var(--u4);}
.brand{display:flex;align-items:center;gap:var(--u3);font-weight:600;font-size:.95rem;flex-shrink:0;}
@media (max-width:620px){.brand span[data-t]{display:none;}}
.brand .ring{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--acc);display:flex;
             align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.brand .ring::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--acc);}
.brand .ring::after{content:'';position:absolute;width:1px;height:8px;background:var(--acc);
                    top:-1px;left:50%;transform:translateX(-50%);}
/* min-width:0 is load-bearing. A flex item refuses to shrink below its own
   min-content width without it, so at 320px this scroller pushed the two
   control buttons 36px (ar) / 68px (en) off the edge — measured, not guessed. */
.chase{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto;}
.chase::-webkit-scrollbar{display:none;}
/* 44px minimum, as the product's own gate requires of every target. */
.chase a{font-size:.74rem;font-weight:500;padding:0 .8rem;min-height:44px;display:inline-flex;
         align-items:center;border-radius:var(--rp);color:var(--txt3);text-decoration:none;
         white-space:nowrap;transition:background .16s ease,color .16s ease;border:1px solid transparent;}
.chase a:hover{background:var(--surf2);color:var(--txt);}
.chase a.active{color:var(--acc);border-color:color-mix(in oklch, var(--acc) 35%, transparent);
                background:color-mix(in oklch, var(--acc) 10%, transparent);}
.ctl{display:flex;gap:var(--u2);flex-shrink:0;}
.ctl button{min-width:44px;min-height:44px;padding-inline:var(--u3);border-radius:var(--rp);
            border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;
            gap:6px;color:var(--txt);background:var(--surf);cursor:pointer;font-family:var(--disp);
            font-size:.76rem;font-weight:500;transition:transform .2s ease,border-color .16s ease;}
.ctl button:hover{border-color:var(--acc);}
.ctl button:active{transform:scale(.94);}
.ctl button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}

/* ===== HERO ===== */
.hero{padding:var(--u10) 0 var(--u8);}
.hero-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:var(--u8);align-items:end;}
.eyebrow{font-family:var(--num);font-size:.7rem;letter-spacing:.12em;color:var(--acc);
         margin-bottom:var(--u4);display:flex;align-items:center;gap:var(--u2);}
.eyebrow .tick{width:16px;height:1px;background:var(--acc);}
h1.hero-h{font-family:var(--disp);font-weight:600;font-size:clamp(2rem,1.3rem + 2.6vw,3.6rem);
          line-height:1.28;letter-spacing:-.02em;max-width:20ch;}
:root:lang(en) h1.hero-h{line-height:1.05;max-width:16ch;}
.hero-h em{color:var(--acc);font-style:normal;}
.lead{margin-top:var(--u5);color:var(--txt2);max-width:56ch;font-size:1.02rem;}
.hero-stats{display:flex;flex-direction:column;gap:var(--u4);border-inline-start:1px solid var(--line);
            padding-inline-start:var(--u6);}
.stat b{font-family:var(--num);font-size:1.9rem;font-weight:400;color:var(--acc);display:block;
        letter-spacing:-.02em;direction:ltr;unicode-bidi:isolate;}
.stat span{font-size:.8rem;color:var(--txt3);line-height:1.6;display:block;}
.ticks-strip{display:flex;gap:3px;height:20px;align-items:flex-end;margin-top:var(--u8);opacity:.5;}
.ticks-strip i{width:1px;background:var(--txt3);flex-shrink:0;}

/* ===== PROGRESS RAIL ===== */
.progress-rail{position:fixed;inset-inline-end:var(--u5);top:50%;transform:translateY(-50%);z-index:60;
               display:flex;flex-direction:column;gap:var(--u3);}
@media (max-width:1000px){.progress-rail{display:none;}}
.progress-rail button{width:10px;height:10px;border-radius:50%;background:var(--line);border:none;
                      cursor:pointer;transition:background .25s ease,transform .25s ease;padding:0;position:relative;}
.progress-rail button.active{background:var(--acc);transform:scale(1.5);}
.progress-rail button:focus-visible{outline:2px solid var(--acc);outline-offset:3px;}
.progress-rail button::after{content:attr(data-label);position:absolute;inset-inline-end:calc(100% + 10px);
  top:50%;transform:translateY(-50%);font-size:.7rem;white-space:nowrap;color:var(--txt2);opacity:0;
  transition:opacity .16s ease;background:var(--surf);padding:.25rem .6rem;border-radius:var(--rp);
  border:1px solid var(--line);pointer-events:none;}
.progress-rail button:hover::after,.progress-rail button:focus-visible::after{opacity:1;}

/* ===== SECTION ===== */
section{padding-block:var(--u9);border-top:1px solid var(--line);}
.sec-head{display:grid;grid-template-columns:auto 1fr;gap:var(--u6);align-items:start;margin-bottom:var(--u7);}
.sec-index{font-family:var(--num);font-size:3.2rem;font-weight:200;color:var(--line);line-height:.9;
           direction:ltr;unicode-bidi:isolate;}
.kicker{font-family:var(--num);font-size:.7rem;letter-spacing:.1em;color:var(--acc);margin-bottom:var(--u2);}
h2.sec-title{font-family:var(--disp);font-size:clamp(1.4rem,1rem + 1.4vw,2.1rem);font-weight:600;
             letter-spacing:-.01em;line-height:1.45;}
.sec-sub{margin-top:var(--u3);color:var(--txt2);max-width:70ch;font-size:.96rem;}

/* ===== PHONE MOCKUPS ===== */
.journey-strip{display:flex;gap:var(--u6);overflow-x:auto;padding:var(--u3) 0 var(--u5);
               scroll-snap-type:x proximity;}
.journey-strip::-webkit-scrollbar{height:6px;}
.journey-strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--rp);}
.phone-step{flex-shrink:0;width:224px;scroll-snap-align:start;}
.phone{width:224px;height:404px;border-radius:26px;border:1px solid var(--line);background:var(--surf);
       box-shadow:var(--shadow);position:relative;overflow:hidden;padding:var(--u2);
       transition:transform .25s ease,border-color .25s ease;}
.phone-step:hover .phone{transform:translateY(-4px);border-color:color-mix(in oklch, var(--acc) 45%, var(--line));}
.phone-notch{width:60px;height:4px;background:var(--line);border-radius:var(--rp);margin:6px auto 8px;}
.phone-screen{background:var(--bg2);border-radius:18px;height:100%;padding:var(--u3);display:flex;
              flex-direction:column;gap:var(--u2);overflow:hidden;}
.ps-topline{display:flex;justify-content:space-between;align-items:center;gap:var(--u2);margin-bottom:var(--u1);}
.ps-badge{font-family:var(--num);font-size:.58rem;letter-spacing:.04em;color:var(--txt3);background:var(--surf);
          padding:.15rem .4rem;border-radius:var(--rp);border:1px solid var(--line);direction:ltr;
          unicode-bidi:isolate;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;}
.ps-title{font-family:var(--disp);font-weight:600;font-size:.85rem;margin-top:var(--u1);line-height:1.5;}
.ps-row{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:var(--u2) var(--u3);
        font-size:.72rem;color:var(--txt2);display:flex;flex-direction:column;gap:2px;}
.ps-row.alarm{border-color:color-mix(in oklch, var(--alarm-c) 45%, var(--line));
              background:color-mix(in oklch, var(--alarm-c) 8%, var(--surf));}
.ps-row.brass{border-color:color-mix(in oklch, var(--brass-c) 45%, var(--line));
              background:color-mix(in oklch, var(--brass-c) 8%, var(--surf));}
.ps-row.jade{border-color:color-mix(in oklch, var(--acc) 40%, var(--line));
             background:color-mix(in oklch, var(--acc) 8%, var(--surf));}
.ps-row b{font-size:.76rem;color:var(--txt);font-weight:600;line-height:1.5;}
.ps-row small{font-size:.63rem;color:var(--txt3);line-height:1.55;}
.ps-btn{margin-top:auto;background:var(--acc);color:var(--case);font-size:.68rem;font-weight:600;
        text-align:center;padding:.5rem;border-radius:var(--rp);line-height:1.5;}
[data-theme="light"] .ps-btn{color:var(--dial-2);}
.ps-btn.ghost{background:none;border:1px solid var(--line);color:var(--txt2);}
.step-caption{margin-top:var(--u3);padding-inline:var(--u1);}
.step-caption .n{font-family:var(--num);font-size:.7rem;color:var(--acc);direction:ltr;unicode-bidi:isolate;}
.step-caption p{font-size:.8rem;color:var(--txt2);margin-top:2px;line-height:1.65;}
/* A machine token IS one of the few things that may break anywhere — the same
   exception css/qareeb.css keeps after removing the global `overflow-wrap:
   anywhere` that was cutting Arabic words in half. `nowrap` here pushed the
   page 68px sideways at 320. */
code{font-family:var(--num);font-size:.72rem;color:var(--acc);direction:ltr;unicode-bidi:isolate;
     background:color-mix(in oklch, var(--acc) 10%, transparent);padding:.05rem .32rem;border-radius:4px;
     overflow-wrap:anywhere;}
.arrow-connector{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:32px;
                 color:var(--line);font-size:1.1rem;}

/* ===== BRANCH CARDS ===== */
.branch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:var(--u4);margin-top:var(--u5);}
.branch{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:var(--u5);position:relative;}
.branch .bnum{position:absolute;top:var(--u4);inset-inline-end:var(--u4);font-family:var(--num);
              font-size:.68rem;color:var(--txt3);direction:ltr;unicode-bidi:isolate;}
.branch h4{font-family:var(--disp);font-weight:600;font-size:.96rem;margin-bottom:var(--u2);
           padding-inline-end:var(--u7);line-height:1.5;}
.branch p{font-size:.85rem;color:var(--txt2);}
.tag-row{margin-top:var(--u3);display:flex;gap:var(--u2);flex-wrap:wrap;}
.mini-tag{overflow-wrap:anywhere;font-size:.66rem;font-family:var(--num);padding:.2rem .5rem;border-radius:var(--rp);
          border:1px solid var(--line);color:var(--txt3);direction:ltr;unicode-bidi:isolate;}
.mini-tag.warn{border-color:color-mix(in oklch, var(--alarm-c) 50%, var(--line));color:var(--alarm-c);}
.mini-tag.good{border-color:color-mix(in oklch, var(--acc) 50%, var(--line));color:var(--acc);}

/* ===== ROUTE TABLE ===== */
.route-table{margin-top:var(--u6);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.rt-row{display:grid;grid-template-columns:1.1fr 1.1fr 2fr;gap:var(--u4);padding:var(--u3) var(--u4);
        border-bottom:1px solid var(--line);align-items:center;}
.rt-row:last-child{border-bottom:none;}
.rt-row.head{background:var(--surf2);font-family:var(--num);font-size:.66rem;letter-spacing:.06em;color:var(--txt3);}
.rt-row .route{font-family:var(--num);font-size:.78rem;color:var(--acc);direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere;}
.rt-row .fn,.rt-row .desc{font-size:.83rem;color:var(--txt2);line-height:1.6;}
@media (max-width:760px){
  .rt-row{grid-template-columns:1fr;gap:var(--u1);padding:var(--u4);}
  .rt-row.head{display:none;}
  .rt-row>div::before{font-family:var(--num);font-size:.6rem;color:var(--txt3);display:block;letter-spacing:.06em;}
  .rt-row .route::before{content:attr(data-l1);}
  .rt-row .fn::before{content:attr(data-l2);}
  .rt-row .desc::before{content:attr(data-l3);}
}

/* ===== BIDI DEMO ===== */
.bidi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:var(--u5);margin-top:var(--u6);}
.bidi-case{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surf);}
.bidi-case>h4{font-family:var(--disp);font-weight:600;font-size:.92rem;padding:var(--u4) var(--u5) var(--u2);line-height:1.5;}
.bidi-case>p.why{font-size:.82rem;color:var(--txt3);padding:0 var(--u5) var(--u4);line-height:1.7;}
.bidi-pair{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);}
.bidi-half{padding:var(--u4) var(--u5);}
.bidi-half+.bidi-half{border-inline-start:1px solid var(--line);}
.bidi-half .lb{font-family:var(--num);font-size:.62rem;letter-spacing:.08em;display:block;margin-bottom:var(--u2);}
.bidi-half.is-bad .lb{color:var(--alarm-c);}
.bidi-half.is-good .lb{color:var(--acc);}
.bidi-out{font-size:1.02rem;line-height:2;min-height:2.4em;}
.bidi-half code.decl{display:block;margin-top:var(--u3);font-size:.66rem;white-space:normal;background:none;
                     padding:0;color:var(--txt3);}
/* The two renderings under test. `.wrong` reproduces the shipped defect. */
.wrong-embed{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;}
.right-iso{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap;}
.wrong-unit{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;font-weight:300;}
.right-unit{unicode-bidi:isolate;white-space:nowrap;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:300;}
.trend-list{list-style:none;}
.trend-list li{display:flex;justify-content:space-between;gap:var(--u4);padding-block:2px;
               border-bottom:1px solid var(--line);}
.trend-list li:last-child{border-bottom:none;}
.trend-list .d{font-size:.72rem;color:var(--txt3);}
.verdict{margin-top:var(--u6);border:1px solid color-mix(in oklch, var(--brass-c) 40%, var(--line));
         border-radius:var(--r);padding:var(--u5);background:color-mix(in oklch, var(--brass-c) 7%, var(--surf));}
.verdict b{color:var(--brass-c);}
.verdict p{font-size:.88rem;color:var(--txt2);margin-top:var(--u2);}

/* ===== RULE RAIL ===== */
.rule-rail{margin-top:var(--u6);position:relative;padding-inline-start:var(--u6);}
.rule-rail::before{content:'';position:absolute;inset-inline-start:5px;top:6px;bottom:6px;width:1px;background:var(--line);}
.rule-item{position:relative;padding-block:var(--u4);}
.rule-item::before{content:'';position:absolute;inset-inline-start:-19px;top:26px;width:9px;height:9px;
                   border-radius:50%;background:var(--bg);border:2px solid var(--acc);}
.rule-item h4{font-family:var(--disp);font-weight:600;font-size:.95rem;margin-bottom:var(--u2);line-height:1.5;}
.rule-item p{font-size:.86rem;color:var(--txt2);max-width:66ch;}
.rule-item .sig{font-family:var(--num);font-size:.68rem;color:var(--txt3);margin-top:var(--u2);
                direction:ltr;unicode-bidi:isolate;}

/* ===== SIMULATOR ===== */
.sim-wrap{margin-top:var(--u6);background:var(--surf);border:1px solid var(--line);border-radius:20px;
          padding:var(--u6);display:grid;grid-template-columns:270px 1fr;gap:var(--u7);align-items:center;}
@media (max-width:840px){.sim-wrap{grid-template-columns:1fr;}}
.sim-phone{width:min(246px,100%);height:444px;border-radius:28px;border:1px solid var(--line);background:var(--bg2);
           box-shadow:var(--shadow);margin-inline:auto;padding:var(--u3);}
.sim-notch{width:64px;height:4px;background:var(--line);border-radius:var(--rp);margin:6px auto 10px;}
.sim-screen{height:calc(100% - 22px);display:flex;flex-direction:column;gap:var(--u2);}
.sim-screen .sst{font-family:var(--num);font-size:.6rem;color:var(--acc);letter-spacing:.05em;
                 direction:ltr;unicode-bidi:isolate;}
.sim-screen h5{font-family:var(--disp);font-weight:600;font-size:1rem;margin-top:2px;line-height:1.5;}
.sim-body{flex:1;display:flex;flex-direction:column;gap:var(--u2);margin-top:var(--u3);}
.sim-card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:var(--u3);
          font-size:.75rem;color:var(--txt2);line-height:1.6;}
.sim-controls{display:flex;flex-direction:column;gap:var(--u4);}
.sim-steps{display:flex;flex-direction:column;gap:var(--u2);}
.sim-step-btn{display:flex;align-items:center;gap:var(--u3);padding:var(--u3);min-height:44px;
              border-radius:var(--r);border:1px solid var(--line);background:var(--bg);cursor:pointer;
              text-align:start;font-family:var(--disp);color:var(--txt2);font-size:.86rem;
              transition:border-color .16s ease,color .16s ease,background .16s ease;}
.sim-step-btn .idx{font-family:var(--num);font-size:.7rem;color:var(--txt3);width:20px;flex-shrink:0;
                   direction:ltr;unicode-bidi:isolate;}
.sim-step-btn.active{border-color:var(--acc);color:var(--txt);background:color-mix(in oklch, var(--acc) 8%, var(--bg));}
.sim-step-btn.active .idx{color:var(--acc);}
.sim-step-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
.sim-nav{display:flex;gap:var(--u3);margin-top:var(--u2);}
.sim-nav button{flex:1;min-height:44px;padding:.65rem;border-radius:var(--rp);border:1px solid var(--line);
                background:var(--bg);color:var(--txt);font-size:.82rem;font-weight:500;cursor:pointer;
                font-family:var(--disp);transition:border-color .16s ease,color .16s ease;}
.sim-nav button:hover{border-color:var(--acc);color:var(--acc);}
.sim-nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}

/* The guarantee is made once, for everything — the same shape as §31 of
   css/qareeb.css, and for the same reason: a hand-written list of animated
   selectors works exactly until someone adds one and forgets. Durations
   collapse rather than being set to `none`, so an entrance animation runs
   instantly to its FINAL state instead of being frozen at opacity 0. */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;
    transition-duration:.01ms !important;transition-delay:0s !important;scroll-behavior:auto !important;
  }
}

/* ============================================================
   RENDER
   ============================================================ */
let LANG = "ar";
const isAr = () => LANG === "ar";
const T = (o) => !o ? "" : (typeof o === "string" ? o : (isAr() ? o.ar : (o.en || o.ar)));

function phone(step){
  const rows = (step.rows || []).map((r) => `<div class="ps-row ${r.k || ""}">
      <b>${T(r.b)}</b>${r.s ? `<small>${T(r.s)}</small>` : ""}</div>`).join("");
  const btns = (step.btns || (step.btn ? [step.btn] : []))
    .map((b) => `<div class="ps-btn ${b.ghost ? "ghost" : ""}">${T(b.t)}</div>`).join("");
  return `<div class="phone-step">
    <div class="phone"><div class="phone-notch"></div>
      <div class="phone-screen" dir="${isAr() ? "rtl" : "ltr"}" lang="${LANG}">
        <div class="ps-topline"><span class="ps-badge">${step.badge}</span>${
          step.badge2 ? `<span class="ps-badge">${step.badge2}</span>` : ""}</div>
        <div class="ps-title">${T(step.title)}</div>
        ${rows}${btns ? `<div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">${btns}</div>` : ""}
      </div></div>
    <div class="step-caption"><span class="n">${step.n}</span><p>${T(step.cap)}</p></div>
  </div>`;
}

function branchCards(list){
  if (!list || !list.length) return "";
  return `<div class="branch-grid">${list.map((b) => `<div class="branch">
    <span class="bnum">${b.n}</span><h4>${T(b.h)}</h4><p>${T(b.p)}</p>
    ${b.tags && b.tags.length ? `<div class="tag-row">${b.tags.map((t) =>
      `<span class="mini-tag ${t.c}">${t.t}</span>`).join("")}</div>` : ""}
  </div>`).join("")}</div>`;
}

function routeTable(tb){
  if (!tb) return "";
  const h = isAr() ? tb.head.ar : tb.head.en;
  return `<div class="route-table">
    <div class="rt-row head"><div>${h[0]}</div><div>${h[1]}</div><div>${h[2]}</div></div>
    ${tb.rows.map((r) => `<div class="rt-row">
      <div class="route" data-l1="${h[0]}">${r[0]}</div>
      <div class="fn" data-l2="${h[1]}">${T(r[1])}</div>
      <div class="desc" data-l3="${h[2]}">${T(r[2])}</div></div>`).join("")}
  </div>`;
}

function head(j){
  return `<div class="sec-head"><div class="sec-index">${j.index}</div>
    <div class="sec-title-wrap"><div class="kicker">${j.kicker}</div>
      <h2 class="sec-title">${T(j.title)}</h2>
      <p class="sec-sub">${T(j.sub)}</p></div></div>`;
}

function journeySection(j){
  const strip = (j.steps || []).map((s, i) => { s.n = String(i + 1).padStart(2, "0"); return phone(s); })
    .join(`<div class="arrow-connector" aria-hidden="true">${isAr() ? "←" : "→"}</div>`);
  return `<section id="${j.id}"><div class="container">${head(j)}
    ${j.steps ? `<div class="journey-strip">${strip}</div>` : ""}
    ${routeTable(j.table)}${branchCards(j.branches)}</div></section>`;
}

function bidiSection(){
  const cases = BIDI.cases.map((c) => `<div class="bidi-case">
    <h4>${T(c.h)}</h4><p class="why">${T(c.why)}</p>
    <div class="bidi-pair">
      <div class="bidi-half is-bad" dir="rtl" lang="ar">
        <span class="lb">${isAr() ? "كان يُرسم هيك" : "RENDERED LIKE THIS"}</span>
        <div class="bidi-out">${c.badHtml || c.bad}</div>
        <code class="decl">${c.declBad}</code></div>
      <div class="bidi-half is-good" dir="rtl" lang="ar">
        <span class="lb">${isAr() ? "الصواب" : "CORRECT"}</span>
        <div class="bidi-out">${c.goodHtml || c.good}</div>
        <code class="decl">${c.declGood}</code></div>
    </div></div>`).join("");
  return `<section id="${BIDI.id}"><div class="container">${head(BIDI)}
    <div class="bidi-grid">${cases}</div>
    <div class="verdict"><b>${isAr() ? "الخلاصة" : "The takeaway"}</b><p>${T(BIDI.verdict)}</p></div>
  </div></section>`;
}

function rulesSection(){
  return `<section id="${RULES.id}"><div class="container">${head(RULES)}
    <div class="rule-rail">${RULES.items.map((r, i) => `<div class="rule-item">
      <h4>${T(r.h)}</h4><p>${T(r.p)}</p>
      <div class="sig">rule ${String(i + 1).padStart(2, "0")}</div></div>`).join("")}</div>
  </div></section>`;
}

const SIM = [
  { badge:"#/", label:"screenRegister()", title:{ar:"الغلاف",en:"Cover"},
    body:[SEED.patient, SEED.blood, {ar:"محفوظ على هذا الهاتف فقط",en:"Saved on this phone only"}] },
  { badge:"alert", label:"CONSENT.requestState()", title:{ar:"طلب معلّق",en:"Pending request"},
    body:[{ar:SEED.doctor.ar+" يطلب الاطّلاع",en:SEED.doctor.en+" is asking to see it"},
          {ar:"اضغط لفتح #/record/request/:id",en:"Tap to open #/record/request/:id"}] },
  { badge:"open now", label:"openRows()", title:{ar:"مفتوح الآن",en:"Open Now"},
    body:[{ar:"الخضاب السكري — غير طبيعي",en:"HbA1c — flagged abnormal"},
          {ar:"متابعة متأخّرة",en:"Follow-up overdue"}] },
  { badge:"ended", label:"historyRows()", title:{ar:"انتهى",en:"Ended"},
    body:[{ar:"حلقة رعاية أُغلقت",en:"Care episode closed"},
          {ar:"زيارة — عيادة الكرادة، قبل 3 أسابيع",en:"Visit — Karrada clinic, 3 weeks ago"}] },
  { badge:"dock", label:"3 exits", title:{ar:"رصيف الأفعال",en:"Dock actions"},
    body:[{ar:"سلّم أوراقاً لطبيب",en:"Hand sheets to a clinician"},
          {ar:"اقرأه لمشكلة وحدة",en:"Read it for one problem"},
          {ar:"شوف أوراقك كلها",en:"See all your sheets"}] },
];
let simIdx = 0;

function simSection(){
  return `<section id="simulator"><div class="container">
    <div class="sec-head"><div class="sec-index">*</div>
      <div class="sec-title-wrap"><div class="kicker">${isAr() ? "جرّبه" : "try it"}</div>
        <h2 class="sec-title">${isAr() ? "امشِ في رحلة الدفتر خطوة خطوة" : "Step through the Register journey"}</h2>
        <p class="sec-sub">${isAr()
          ? "اضغط خطوة، أو استعمل التالي والسابق، لتحسّ التسلسل بدل أن تقرأ عنه."
          : "Click a step, or use next and previous, to feel the sequence rather than read about it."}</p></div></div>
    <div class="sim-wrap">
      <div class="sim-phone"><div class="sim-notch"></div>
        <div class="sim-screen" id="simScreen" dir="${isAr() ? "rtl" : "ltr"}" lang="${LANG}" aria-live="polite"></div></div>
      <div class="sim-controls">
        <div class="sim-steps" id="simSteps"></div>
        <div class="sim-nav">
          <button id="simPrev">${isAr() ? "السابق" : "Prev"}</button>
          <button id="simNext">${isAr() ? "التالي" : "Next"}</button>
        </div></div>
    </div></div></section>`;
}

function renderSim(){
  const s = SIM[simIdx];
  const el = document.getElementById("simScreen");
  if (!el) return;
  el.innerHTML = `<span class="sst">${s.badge} · ${s.label}</span>
    <h5>${T(s.title)}</h5>
    <div class="sim-body">${s.body.map((l) => `<div class="sim-card">${T(l)}</div>`).join("")}</div>`;
  document.querySelectorAll(".sim-step-btn").forEach((b, i) => {
    b.classList.toggle("active", i === simIdx);
    b.setAttribute("aria-current", i === simIdx ? "step" : "false");
  });
}

const ALL = () => [...JOURNEYS, BIDI, RULES, { id:"simulator", label:{ar:"المحاكي",en:"Simulate"} }];

function render(){
  const root = document.documentElement;
  root.lang = LANG; root.dir = isAr() ? "rtl" : "ltr";

  document.querySelectorAll("[data-t]").forEach((el) => { el.innerHTML = T(DATA[el.dataset.t]); });

  document.getElementById("heroStats").innerHTML = DATA.stats.map((s) =>
    `<div class="stat"><b>${s.n}</b><span>${isAr() ? s.ar : s.en}</span></div>`).join("");

  document.getElementById("sections").innerHTML =
    JOURNEYS.map(journeySection).join("") + bidiSection() + rulesSection() + simSection();

  const chase = document.getElementById("chaseNav");
  const rail = document.getElementById("progressRail");
  chase.innerHTML = ""; rail.innerHTML = "";
  ALL().forEach((s) => {
    const a = document.createElement("a");
    a.href = "#" + s.id; a.textContent = T(s.label); a.dataset.id = s.id;
    chase.appendChild(a);
    const b = document.createElement("button");
    b.dataset.id = s.id; b.setAttribute("data-label", T(s.label));
    b.setAttribute("aria-label", T(s.label));
    b.addEventListener("click", () => document.getElementById(s.id)
      .scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }));
    rail.appendChild(b);
  });

  const steps = document.getElementById("simSteps");
  SIM.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "sim-step-btn";
    b.innerHTML = `<span class="idx">${String(i + 1).padStart(2, "0")}</span><span>${T(s.title)}</span>`;
    b.addEventListener("click", () => { simIdx = i; renderSim(); });
    steps.appendChild(b);
  });
  document.getElementById("simPrev").addEventListener("click",
    () => { simIdx = (simIdx - 1 + SIM.length) % SIM.length; renderSim(); });
  document.getElementById("simNext").addEventListener("click",
    () => { simIdx = (simIdx + 1) % SIM.length; renderSim(); });
  renderSim();

  observe();
  document.getElementById("langToggle").innerHTML =
    `<span class="mark">${isAr() ? "EN" : "ع"}</span>`;
}

let obs = null;
function observe(){
  if (obs) obs.disconnect();
  obs = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (!e.isIntersecting) return;
      document.querySelectorAll(".chase a").forEach((a) => a.classList.toggle("active", a.dataset.id === e.target.id));
      document.querySelectorAll(".progress-rail button").forEach((b) => b.classList.toggle("active", b.dataset.id === e.target.id));
    });
  }, { rootMargin: "-40% 0px -50% 0px" });
  ALL().forEach((s) => { const el = document.getElementById(s.id); if (el) obs.observe(el); });
}

/* ticks — the identity motif, decorative only */
(function(){
  const t = document.getElementById("ticksStrip");
  for (let i = 0; i < 70; i++){
    const el = document.createElement("i");
    el.style.height = i % 5 === 0 ? "20px" : i % 2 === 0 ? "12px" : "7px";
    t.appendChild(el);
  }
})();

/* theme */
(function(){
  const btn = document.getElementById("themeToggle");
  const sun = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  const moon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  let d = "dark";
  btn.innerHTML = sun;
  btn.addEventListener("click", () => {
    d = d === "dark" ? "light" : "dark";
    document.body.setAttribute("data-theme", d);
    btn.innerHTML = d === "dark" ? sun : moon;
  });
})();

/* language */
document.getElementById("langToggle").addEventListener("click", () => {
  LANG = isAr() ? "en" : "ar";
  simIdx = 0;
  render();
});

render();
</script>
</body>
</html>
