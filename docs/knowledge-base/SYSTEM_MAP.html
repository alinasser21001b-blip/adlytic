<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawai — System Map</title>
<style>
:root{
  --bg:#0D1A15; --raised:#142720; --sunken:#1B2B22; --line:#1E3A2D;
  --ink:#F3F7F2; --muted:#9FC6B6; --subtle:#8FA89C;
  --accent:#2ECF9A; --on-accent:#0B241B;
  --warn:#E8B34B; --alert:#FF9C8A; --on-alert:#7A150F;
  --blue:#8CC2F5; --violet:#C6A8F5;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F7F9F7; --raised:#FFFFFF; --sunken:#ECF0EC; --line:#D2DCD6;
    --ink:#0E1A16; --muted:#3B4B45; --subtle:#556760;
    --accent:#186047; --on-accent:#FFFFFF;
    --warn:#7A4E0A; --alert:#8C2F1F; --on-alert:#FFFFFF;
    --blue:#14497D; --violet:#5B3A8C;
  }
}
:root[data-theme="light"]{
  --bg:#F7F9F7; --raised:#FFFFFF; --sunken:#ECF0EC; --line:#D2DCD6;
  --ink:#0E1A16; --muted:#3B4B45; --subtle:#556760;
  --accent:#186047; --on-accent:#FFFFFF;
  --warn:#7A4E0A; --alert:#8C2F1F; --on-alert:#FFFFFF;
  --blue:#14497D; --violet:#5B3A8C;
}
:root[data-theme="dark"]{
  --bg:#0D1A15; --raised:#142720; --sunken:#1B2B22; --line:#1E3A2D;
  --ink:#F3F7F2; --muted:#9FC6B6; --subtle:#8FA89C;
  --accent:#2ECF9A; --on-accent:#0B241B;
  --warn:#E8B34B; --alert:#FF9C8A; --on-alert:#7A150F;
  --blue:#8CC2F5; --violet:#C6A8F5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.88em}

/* ── header ─────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:20;background:var(--bg);
       border-bottom:1px solid var(--line);padding:14px 20px}
.hdr{display:flex;gap:16px;align-items:center;flex-wrap:wrap;max-width:1600px;margin:0 auto}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--accent)}
/* The counts line wraps rather than forcing the page wider than the viewport —
   a nowrap run of 60 characters was the whole of the horizontal overflow. */
.tag{font-size:12px;color:var(--subtle);border:1px solid var(--line);
     border-radius:999px;padding:2px 10px;min-width:0}
#q{flex:1;min-width:200px;background:var(--sunken);border:1px solid var(--line);
   color:var(--ink);border-radius:999px;padding:9px 16px;font-family:inherit;font-size:14px}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.themebtn{background:var(--sunken);border:1px solid var(--line);color:var(--muted);
          border-radius:999px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:13px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;max-width:1600px;margin:12px auto 0}
nav.tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:13px;white-space:nowrap}
nav.tabs button:hover{border-color:var(--accent);color:var(--ink)}
nav.tabs button[aria-current="true"]{background:var(--accent);color:var(--on-accent);
  border-color:var(--accent);font-weight:600}

/* ── layout ─────────────────────────────────────────────── */
main{max-width:1600px;margin:0 auto;padding:22px 20px 80px;
     display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr)}
  aside{position:static !important;max-height:none !important}}
aside{position:sticky;top:120px;max-height:calc(100vh - 150px);overflow:auto;
      background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:18px}
aside h3{margin:0 0 4px;font-size:17px}
aside .kind{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);
  font-weight:700;margin-bottom:10px}
aside dl{margin:0}
aside dt{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--subtle);
  margin-top:13px;font-weight:600}
aside dd{margin:3px 0 0;font-size:14px}
aside ul{margin:4px 0 0;padding-left:18px;font-size:14px}
aside li{margin:2px 0}
.empty{color:var(--subtle);font-size:14px}

h2{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
h2 .n{color:var(--subtle);font-weight:400;font-size:15px;margin-left:8px}
.lede{color:var(--muted);margin:0 0 18px;max-width:80ch}
section.panel{display:none}
section.panel[data-on="1"]{display:block}
.group{margin:0 0 26px}
.group>h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--subtle);
  margin:0 0 10px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}

/* ── node grid ──────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.node{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;
  transition:border-color .12s,transform .12s;min-height:64px;display:block;width:100%}
.node:hover{border-color:var(--accent);transform:translateY(-1px)}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.node[data-sel="1"]{border-color:var(--accent);background:var(--sunken)}
.node .t{font-weight:650;font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.node .s{color:var(--subtle);font-size:12.5px;margin-top:3px;line-height:1.45}
/* A pill wraps rather than pushing past its card: a few status labels are a
   whole sentence, and a nowrap run of them broke out of the node. */
.pill{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  border-radius:999px;padding:2px 7px;border:1px solid var(--line);color:var(--muted);
  white-space:normal;overflow-wrap:anywhere;line-height:1.5;max-width:100%}
.pill.ok{color:var(--accent);border-color:var(--accent)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--alert);border-color:var(--alert)}
.pill.info{color:var(--blue);border-color:var(--blue)}
.pill.vio{color:var(--violet);border-color:var(--violet)}

/* ── diagram ────────────────────────────────────────────── */
.diagram{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;overflow-x:auto;margin-bottom:24px}
.layers{display:flex;flex-direction:column;gap:8px;min-width:600px}
.layer{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunken)}
.layer .lt{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);
  font-weight:700;margin-bottom:8px}
.layer .row{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:6px 11px;
  font-size:13px;cursor:pointer;font-family:inherit;color:inherit;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.arrow{text-align:center;color:var(--subtle);font-size:16px;line-height:1}
.note{font-size:12.5px;color:var(--subtle);margin-top:10px;max-width:90ch}

/* ── machine ────────────────────────────────────────────── */
.mach{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:16px}
.mach h5{margin:0 0 3px;font-size:16px}
.mach .meta{font-size:12px;color:var(--subtle);margin-bottom:12px}
.states{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.st{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;
  font-family:var(--mono);background:var(--sunken)}
.st.init{border-color:var(--accent);color:var(--accent)}
.st.term{border-color:var(--alert);color:var(--alert)}
.scroller{overflow-x:auto}
table.tr{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
table.tr th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--subtle);border-bottom:1px solid var(--line);padding:5px 8px 5px 0;font-weight:600}
table.tr td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.tr td:nth-child(1),table.tr td:nth-child(2),table.tr td:nth-child(3){font-family:var(--mono);font-size:12.5px}
table.tr td:nth-child(4){color:var(--subtle);font-size:12px}
table.tr tr:last-child td{border-bottom:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--subtle);margin-bottom:14px}
.legend b{color:var(--ink);font-weight:600}

.searchout{margin-bottom:22px}
.hits{display:flex;flex-direction:column;gap:6px}
.hit{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:9px 13px;
  cursor:pointer;font-family:inherit;color:inherit;text-align:left;font-size:14px;width:100%}
.hit:hover{border-color:var(--accent)}
.hit .w{font-size:11px;color:var(--subtle);text-transform:uppercase;letter-spacing:.07em;margin-left:8px}
footer{max-width:1600px;margin:0 auto;padding:0 20px 50px;color:var(--subtle);font-size:12.5px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;
  padding:1px 5px;background:var(--sunken)}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="brand">دوائي <span>Dawai</span> — System Map</div>
    <div class="tag" id="stat">loading…</div>
    <input id="q" type="search" placeholder="Search anything — screen, rule, decision, event, table, package, debt…" autocomplete="off">
    <button class="themebtn" id="theme">◐ theme</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div id="content"></div>
  <aside id="detail"><div class="empty">Click any node to see what it is, why it exists, and what it connects to.</div></aside>
</main>

<footer id="foot"></footer>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   THE MODEL. Everything on this page is rendered from here, so a node, its
   detail panel and its search entry cannot disagree.
   Sourced from: platform/ (code), docs/product/v3/{register,phase0}.js,
   docs/technical/model.js, platform/tools/review/debt.mjs
   ═══════════════════════════════════════════════════════════════════════════ */
const KB = "See docs/knowledge-base/";

const D = {

/* ── 1. PACKAGES ────────────────────────────────────────────────────────── */
packages:[
 {id:"@dawai/domain",kind:"package",layer:"domain",owner:"platform-foundation",
  sub:"Every business rule. PURE — no I/O, no clock, no randomness.",
  why:"Rule 3 places every business rule here and nowhere else. This package imports no Node built-in, performs no I/O, reads no clock and generates no randomness — enforced by tools/layer-check.mjs — so every rule is deterministic and independently testable, which is Rule 7.",
  bp:"§2 · §6 · §7 · §8 · §9",
  exports:["Result / ok / err","REFUSAL (closed set)","Instant / Clock","16 branded ids","defineMachine / transition / audit","Marketplace.*","Clinical.*","Authority.authorise","Family.*","Verification.*","8 state machines"],
  deps:["@dawai/contracts (types only)"],
  files:["shared/{result,refusal,instant,ids,machine}.ts","marketplace/{rules,machines}.ts","clinical/gates.ts","identity/{authority,family,machines,verification}.ts","pharmacy/machines.ts"],
  doc:"03-domain-model.md · 04-business-rules.md · 05-state-machines.md"},

 {id:"@dawai/design",kind:"package",layer:"design",owner:"platform-foundation",
  sub:"Tokens, accessibility, RTL, Arabic plurals, the screen contract.",
  why:"Everything a screen may use to express distance, colour, type and motion lives here, so a component never writes a raw value — and the screen contract lives here too, because UX correctness is checked the same way layer boundaries are.",
  bp:"§25 · §26 · §27 · §22 · §23",
  exports:["space / radius / tap / frame / elevation","type (7 roles) / tracking / fontStack","palettes (3 personas × 2 schemes)","motion (13 tokens, each with `teaches`)","luminance / contrastRatio / meets","RTL: resolveEdge / isolate / toWesternDigits","plural / counted (4 CLDR forms)","ScreenContract / auditContract"],
  deps:["nothing — MAY NOT import @dawai/domain"],
  doc:"12-design-system.md"},

 {id:"@dawai/navigation",kind:"package",layer:"nav",owner:"patient-app",
  sub:"Flows, the derived graph, route guards.",
  why:"Location, previous step, next step and progress are derived from declared flows and a graph built from the screen contracts, so no screen hard-codes an answer and no screen can quietly become a dead end.",
  bp:"§5 · §7 · D26",
  exports:["Flow / progressAt / auditFlow","buildGraph / unreachable / traps / danglingExits","resolveBack / stackFor / flowGaps","requireSession / requireOrderScope / blockMemorialised","runGuards / guardDestinations / ROUTE_GUARDS"],
  deps:["nothing — takes a structural NavScreen so there is no cycle with design"],
  doc:"08-navigation.md"},

 {id:"@dawai/session",kind:"package",layer:"app",owner:"identity-service",
  sub:"Session lifecycle and the pending intent.",
  why:"D26: the pending action must survive authentication. Losing a user's request because they had to sign in is the most common version of that mistake, and for a frightened patient it is the moment they close the app.",
  bp:"§6 Session · D26 · D28 · §3.1 · §3.2",
  exports:["guest / interrupt / beginVerification","authenticate / takePending (returns AND clears)","signOut (D28 — the caller destroys the cache key)","switchSubject"],
  doc:"11-runtime.md · 09-permissions.md"},

 {id:"@dawai/offline",kind:"package",layer:"app",owner:"platform-foundation",
  sub:"The outbox. Queued, sending, accepted, rejected, cancelled.",
  why:"Iraqi mobile data drops routinely, so offline is a normal state rather than an error. A queued request is NEVER presented as sent, and a replay after reconnection must land exactly once — a duplicate reservation would be a clinical defect, not an inconvenience.",
  bp:"§21 · D27 · §6 Session & outbox · R13",
  exports:["enqueue (dedupes by idempotency key)","readyToSend (oldest per subject)","markSending / markAccepted / markDuplicate→accepted","markRejected / requeue / cancel / prune","describe() — the ONLY wording a screen may use"],
  note:"There is deliberately no `duplicate` state: a 409 IS success.",
  doc:"11-runtime.md · 05-state-machines.md"},

 {id:"@dawai/net",kind:"package",layer:"app",owner:"platform-foundation",
  sub:"Retry policy and response classification.",
  why:"A retry that duplicates a write is worse than a failure the user can see. Every state-changing call carries an idempotency key, so the retry question is only 'how long do we wait' — and on a bad connection the answer must not hammer a network that is already struggling.",
  bp:"§21 · D27 · §8",
  exports:["classify(status) → accepted|duplicate|transient|permanent","DEFAULT_POLICY {6 attempts, 1s base, 60s cap}","delayFor(attempt, policy, random) — full jitter","shouldRetry / exhausted"],
  note:"Jitter matters specifically: when a cell tower returns, every queued device retries at once, and identical backoff turns a recovery into a thundering herd.",
  doc:"13-api-contracts.md"},

 {id:"@dawai/observability",kind:"package",layer:"app",owner:"platform-foundation",
  sub:"Logger, telemetry, errors. The closed set of 12 business events.",
  why:"§3 defines four exit criteria and puts the screens that measure them inside Phase 0. Those measurements need events, and the set is closed so that a metric can never be computed from an ad-hoc counter somebody added in a controller.",
  bp:"§3 · §8 · O12 · O13 · O14 · O15",
  exports:["BUSINESS_EVENT (12 names, closed)","createTelemetry / memoryTelemetry","TelemetryRecord {event, at, correlationId, attributes}"],
  note:"Attributes are dimensions, never content. A district id is a dimension; a medicine name is not.",
  doc:"15-events.md"},

 {id:"@dawai/config",kind:"package",layer:"app",owner:"platform-foundation",
  sub:"Environment, secrets, feature flags.",
  why:"§3 lists five prerequisites before the first request — one is that the launch district is named in configuration BEFORE the first pharmacy is verified (D40). A configuration layer that lets the process start without it would turn an architectural constraint into a hope.",
  bp:"§3 · D40 · §10 · D20",
  exports:["PHASE_0_FLAGS = [] (deliberately)","flagResolver — THROWS on an unregistered flag"],
  note:"Phase 0 ships no feature flags. Nothing in it is conditional, so a flag would gate behaviour the Blueprint does not describe.",
  doc:"02-architecture.md"},

 {id:"@dawai/contracts",kind:"package",layer:"app",owner:"platform-foundation",
  sub:"Shared types with no behaviour. Currently, deliberately, empty.",
  why:"The domain must be importable by every layer without dragging anything with it. This package holds only types, so importing it from any layer costs nothing at runtime and can never move a rule out of the domain.",
  note:"Deliberately empty: an invented type here would be an invented contract.",
  doc:"02-architecture.md"},
],

/* ── 2. APP MODULES ─────────────────────────────────────────────────────── */
modules:[
 {id:"web/host.ts",kind:"module",layer:"host",owner:"patient-app",
  sub:"The browser host — the only place browser globals are touched.",
  why:"createRuntime needs a clock, ids, connectivity, somewhere to keep bytes and a way to wait. On a device those come from Expo; here from the browser. Nothing in this file decides anything — it is a dozen one-line answers.",
  note:"camera() returns a LOCAL URI and nothing else. It used to return an imageId, which a platform cannot know — the interface was asking the host to do the app's job. Dismissing the picker fires no `change` in any browser, so it listens for `cancel` and falls back to focus+500ms.",
  doc:"11-runtime.md §3"},

 {id:"main/host.ts",kind:"module",layer:"root",owner:"patient-app",
  sub:"The Host interface — everything the app cannot decide for itself.",
  why:"Naming these here means createRuntime is ordinary testable code and the platform-specific part is a handful of one-line functions per host. It is also the honest boundary for what does not exist: a host that cannot take a photograph says so by returning null rather than by pretending.",
  members:["baseUrl","clock()","newId()","online() — advisory only","store: Store","sleep(ms)","random()","camera: null | (() => Promise<{localUri}|null>)","log(line)"],
  doc:"11-runtime.md §3"},

 {id:"main/runtime.ts",kind:"module",layer:"root",owner:"patient-app",
  sub:"The composition root — the ONLY file allowed to read a clock or randomness.",
  why:"TD-1 said since the first slice that nothing constructs a Runtime and nothing mounts App.tsx, so every screen, the reducer, the ports and the effect loop were proved in isolation and the assembled application had never started once. This is the assembly.",
  members:["deviceIdFrom(host) — minted once, kept","searchCache(host)","authorityFrom(...) — asks Authority.authorise","watch(requestId, windowEndsAt) — 3s poll (TD-21)","ticks(onTick) — 1 Hz, only while a clock is on screen","connect(send) — the runtime→app channel","onVerified / onDistrict — facts the store may not derive","onEffectFailed — REQUIRED, not optional"],
  note:"The values have to enter somewhere, and this is the named door. tools/layer-check.mjs enforces it is the only one.",
  doc:"11-runtime.md §2"},

 {id:"app/store.ts",kind:"module",layer:"app",owner:"patient-app",
  sub:"The pure reducer. 917 lines. 40 intents, 10 effects. No I/O.",
  why:"Everything that decides what the user sees lives here so all of it is testable without a device: navigation, guards, the draft, the outbox, and which telemetry the action emits. dispatch returns the next state AND the effects rather than performing them — which is what makes 'the user tapped send while offline' a test rather than a manual check on a phone with aeroplane mode on.",
  bp:"§4 · §5 rule 1 · D26 · D27 · R1 · R6 · R7 · F1 · F2",
  note:"§5 rule 1: a guard here decides only what is SHOWN; the server refuses regardless, and this file contains no permission logic of its own — it asks runGuards.",
  doc:"11-runtime.md §4"},

 {id:"infra/http.ts",kind:"module",layer:"infra",owner:"patient-app",
  sub:"The one HTTP transport — every byte that leaves the app goes here.",
  why:"One transport rather than fetch-per-port, because the rules that make the network survivable are cross-cutting: every response classified by the SAME classify so a 409 is a duplicate everywhere; a network error is transient because a phone walking out of coverage is normal operation; and every state-changing call carries its idempotency key.",
  note:"An abort is classified `permanent` with reason CANCELLED, named BEFORE the network case — an AbortError is an Error like any other and would otherwise read as a dropped connection.",
  doc:"11-runtime.md §5"},

 {id:"infra/flush.ts",kind:"module",layer:"infra",owner:"patient-app",
  sub:"The outbox delivery engine. One lane, one item at a time.",
  why:"The outbox knew its states, the retry policy knew its delays, and classify knew what a status means. This walks the ready items through all three, so 'eventually sent, exactly once, never silently dropped' is one function's contract instead of a property smeared across the app.",
  note:"Re-reads the LIVE outbox between items and merges: live wins on membership, this run wins on the item it holds, and a `cancelled` decision always wins. Without that, a cancel on R13 mid-flush sent anyway.",
  doc:"11-runtime.md §7"},

 {id:"infra/perform.ts",kind:"module",layer:"infra",owner:"patient-app",
  sub:"The effect runner. Store → effect → port → intent → store.",
  why:"The store emits effects that SAY what should happen; this is the one place that DOES it, and answers back in intents — so no port result ever touches a screen directly, which is what keeps 'never trust the client' checkable: the reducer is the only door.",
  note:"Ends with `const unhandled: never = effect`. The app shipped with TWO runners — this one, imported by nothing, and a copy in App.tsx that never handled requestCode or verifyCode, so a patient submitting a phone number emitted an effect that fell on the floor.",
  doc:"11-runtime.md §4"},

 {id:"infra/catalogue.ts",kind:"module",layer:"infra",owner:"catalogue-service",
  sub:"CataloguePort. The ONLY cached endpoint.",
  why:"F2's offline state promises cached results labelled with their age, and a promise a screen makes is one this port has to keep: every fresh response is written through, and a failed fetch falls back — answering `cached` with the WRITE time, so the age is when the data was TRUE, not when it was retrieved.",
  note:"isHit requires all three clinical booleans by typeof. A hit carrying requestable:true but MISSING isControlled was gated ALLOWED, so D42 never fired for a controlled medicine — and the cache replays rows an older build wrote, with no server in the loop to correct them.",
  doc:"10-clinical-safety.md §4"},

 {id:"infra/marketplace.ts",kind:"module",layer:"infra",owner:"marketplace-engine",
  sub:"MarketplacePort — the most consequential call the patient app makes.",
  why:"It turns a comparison into a commitment, and a pharmacy sets medicine aside on the strength of it. Everything downstream was built and nothing performed the call, so chooseOffer computed which lines the patient agreed to and dropped them on the floor. A patient who chose a pharmacy watched V1 forever.",
  note:"A reservation in the body IS the answer, whatever the status — 409 is three things here, including a REPLAY. Checking `duplicate` first turned a withdrawn offer into an unreadable reservation.",
  doc:"13-api-contracts.md"},

 {id:"infra/identity.ts",kind:"module",layer:"infra",owner:"identity-service",
  sub:"IdentityPort. A translation, not a policy.",
  why:"The API contract declares exactly what each endpoint can say, and the port's job is to map each declared response onto the typed result the store handles, so an undeclared response surfaces as a failure rather than being guessed into meaning.",
  note:"A 400 without attemptsLeft is a PERMANENT failure. It used to default to 0, which the store reads as exhausted — so a patient's FIRST wrong digit told them all five attempts were gone.",
  doc:"13-api-contracts.md"},

 {id:"infra/requests.ts",kind:"module",layer:"infra",owner:"marketplace-engine",
  sub:"RequestsPort. Deliberately NOT cached.",
  why:"R7's whole job is to make a wait legible, and until this existed the wait was not a wait: the request was sent, pharmacies answered, and the app never asked. offerArrived had been in the intent union since the first slice with nothing able to produce it.",
  note:"F2 caches search because a catalogue is the same tomorrow; an offer is a live commitment with a price and a state, and showing a stale one would tell a patient a pharmacy is holding something it has withdrawn.",
  doc:"13-api-contracts.md"},

 {id:"infra/media.ts",kind:"module",layer:"infra",owner:"media-service",
  sub:"MediaPort — multipart prescription upload.",
  why:"R2 and R3 were built, reviewed and photographed, and no photograph could be taken or sent — so D18 closed the whole class of medicine that needs one. TD-9 called that a device problem for months; it was not. The real obstacle was Host.camera returning an imageId, which a platform cannot know.",
  note:"Content-type is deliberately NOT set: the platform writes it with the multipart boundary it generated. Phase 0 reads nothing (D18) — the dev server counts the bytes and discards them.",
  doc:"10-clinical-safety.md"},

 {id:"screens/core-loop.contract.ts",kind:"module",layer:"screens",owner:"patient-app",
  sub:"22 declared screen contracts, transcribed from Blueprint v3 §4.",
  why:"Stage 6 builds screens; this declares what each one OWES the user BEFORE any of them is built, so a screen cannot be called finished while it leaves someone wondering where they are or what to do next.",
  doc:"07-screen-catalog.md"},

 {id:"screens/graph.ts",kind:"module",layer:"screens",owner:"patient-app",
  sub:"The navigation graph, isBuilt, NOT_YET_BUILT — all derived from contracts.",
  why:"Which screens this build has, how they connect, and which declared exits it cannot yet honour are properties of the CONTRACTS, not of the reducer. They lived in app/store.ts, so every screen importing the module that owns dispatch just to ask whether a destination exists.",
  note:"isBuilt means contracted AND drawable. It used to mean only 'contracted', so R1's «لمن؟» rendered, was tapped, navigated successfully, and drew the SEARCH screen over the request the patient had just built (TD-19).",
  doc:"08-navigation.md"},
],

  bp:"D01 · D03 · D05"},
 {id:"Subject",kind:"entity",table:"subjects",svc:"identity-service",
  sub:"The person the medicine is for. Need not authenticate (D01).",
  inv:["type ∈ {self, managed}","UNIQUE(owner_account_id) WHERE type='self'","A managed subject has exactly one active guardianship"],
  note:"THE change that reaches furthest: v1 could not represent its own primary persona — it required an elderly woman who uses only WhatsApp to own a smartphone and approve on her own device.",
  states:"self · managed · claim_pending · memorialised · deleted", bp:"D01 · D03 · D04"},
 {id:"Guardianship",kind:"entity",table:"guardianships",svc:"identity-service",

  inv:["UNIQUE(subject_id) WHERE state='active' — exactly one guardian (D01)","Max 6 managed subjects per guardian (§4 S3)"],

 {id:"PeerGrant",kind:"entity",table:"peer_grants",svc:"identity-service",

 {id:"CatalogueItem",kind:"entity",table:"catalogue_items",svc:"catalogue-service",

 {id:"District",kind:"entity",table:"districts",svc:"catalogue-service",

/* ── 5. STATE MACHINES ──────────────────────────────────────────────────── */
machines:[
 {id:"Request",bp:"§6 Request",owner:"marketplace-engine",
  initial:["draft"],terminal:["closed"],
  t:[["draft","send","queued","D27 — sent while offline"],["draft","connectionReturned","broadcast","sent"],
     ["queued","connectionReturned","broadcast",""],["queued","cancelFromOutbox","draft","D27"],
     ["broadcast","offerArrived","answered",""],["broadcast","windowElapsed","unanswered","D09 — nothing fires this yet (TD-23)"],
     ["answered","acceptOffer","accepted",""],["answered","windowElapsed","unanswered","offers expired"],
     ["unanswered","widen","broadcast","§4 R11"],["unanswered","abandon","closed",""],
     ["accepted","childCreated","partially_filled","D06"],["accepted","allLinesReserved","closed",""],
     ["partially_filled","widen","broadcast","D06 child request"],["partially_filled","abandon","closed",""]],
  note:"⚠ TD-20: POST /v1/requests/{id}/cancel is declared in the API model, and this machine has NO outgoing edge for a cancellation from broadcast or answered. Two frozen documents disagree; adding the edge is inventing a state transition."},

 {id:"Offer",bp:"§6 Offer",owner:"marketplace-engine",
  initial:["composing"],terminal:["withdrawn","expired","not_chosen","accepted","abandoned"],
  t:[["composing","send","sent",""],["composing","leave","abandoned",""],
     ["sent","withdraw","withdrawn","D08 — the correction path, BEFORE acceptance only"],
     ["sent","windowElapsed","expired",""],["sent","otherChosen","not_chosen",""],["sent","accept","accepted",""]],
  note:"There is NO edge out of `accepted`. After acceptance the price BINDS (D08). The patient app narrows this to 5 displayable states — composing and abandoned belong to the pharmacy's lifecycle."},

 {id:"Reservation",bp:"§6 Reservation",owner:"marketplace-engine",
  initial:["requested"],terminal:["refused","collected","expired","cancelled"],
  t:[["requested","confirm","held","⏱ THE CLOCK STARTS HERE"],["requested","cannotHold","refused","D39"],
     ["requested","cancel","cancelled","§4 V5"],["held","verifyCode","collected","§4 P14"],
     ["held","windowElapsed","expired",""],["held","cancel","cancelled","§4 V5"]],
  note:"A countdown before anyone has committed stock counts down to a disappointment. V1 shows NO timer at all, and its contract declares back:none — the screen resolves to V2 or V4 on its own."},

 {id:"Subject",bp:"§6 Subject lifecycle",owner:"identity-service",
  initial:["self","managed"],terminal:["deleted"],
  t:[["managed","sendClaimInvite","claim_pending","§4 S9"],["claim_pending","inviteExpiredOrRefused","managed",""],
     ["claim_pending","numberVerified","self","⚠ D01 — GUARDIANSHIP ENDS"],
     ["managed","transferGuardianship","managed","§4 S10 — authority moves in full"],
     ["self","recordDeath","memorialised","D04"],["managed","recordDeath","memorialised","D04"],
     ["memorialised","reverse","self","D04 — within 30 days"],
     ["self","delete","deleted","D05"],["managed","delete","deleted","guardian chose delete"],["memorialised","delete","deleted","D05"]],
  note:"The most consequential edge in the product. Writing it as a table is what stops it being softened later by someone who finds ending guardianship inconvenient."},

 {id:"PeerGrant",bp:"§6 Grant lifecycle",owner:"identity-service",
  initial:["invited"],terminal:["refused","revoked","expired"],
  t:[["invited","inviteeSignsIn","pending","D02 — the NORMAL case"],["invited","sevenDays","expired","D02"],
     ["pending","approve","active","§4 S7"],["pending","refuse","refused","§4 S7"],
     ["active","narrow","active","the subject may narrow the scope"],["active","revoke","revoked","§4 S8"]],
  note:"⚠ BD-6: invites live inside this machine with no entity of their own, so an invite cannot be listed, resent or cancelled."},

 {id:"Challenge",bp:"§9 Identity · E6",owner:"identity-service",
  initial:["requested"],terminal:["verified","spent","expired"],
  t:[["requested","delivered","sent",""],["requested","timePassed","expired",""],
     ["sent","correctCode","verified",""],["sent","wrongCode","sent","⟳ attempts left — the whole point of counting"],
     ["sent","attemptsExhausted","spent",""],["sent","timePassed","expired",""],
     ["expired","resend","requested","a NEW challenge, never a revived one"],["spent","resend","requested",""]],
  note:"5 attempts, 10-minute lifetime, 45-second resend cooldown. Expiry is checked BEFORE the attempt is counted — a code that ran out of time is not a wrong answer."},

 {id:"Verification",bp:"§6 Verification",owner:"pharmacy-service",
  initial:["drafting"],terminal:["closed"],
  t:[["drafting","submit","submitted","§4 PA7"],["drafting","close","closed","applicant abandons"],
     ["submitted","requestInfo","info_requested","§4 PA9"],["submitted","reject","rejected","with a reason and an appeal path"],
     ["submitted","approve","verified","D10 — the operator sets the map point"],
     ["info_requested","resubmit","submitted",""],["info_requested","close","closed",""],
     ["rejected","appeal","submitted",""],["rejected","close","closed","applicant withdraws"],
     ["verified","sixtyDaysToExpiry","expiring","warnings at 60/30/7"],["verified","suspend","suspended","§4 O6"],
     ["verified","close","closed","D15 · §4 P28"],
     ["expiring","renew","verified",""],["expiring","expiryReached","lapsed","routing stops, LIVE RESERVATIONS HONOURED"],
     ["expiring","suspend","suspended","§4 O6"],
     ["lapsed","renew","verified",""],["lapsed","close","closed",""],
     ["suspended","reinstate","verified","§4 O6"],["suspended","close","closed",""]],
  note:"D15 — a pharmacy has a way to leave. `close` is reachable from six states, including two where the applicant simply abandons."},

 {id:"BranchEligibility",bp:"§6 Branch eligibility",owner:"pharmacy-service",
  initial:["receiving"],terminal:[],
  t:[["receiving","outsideHours","closed","§8 routing rule 3"],["closed","openingTimeReached","receiving","D09"],
     ["receiving","pause","paused","§4 P21"],["paused","resume","receiving",""],
     ["receiving","capacityReached","at_capacity","§8 routing rule 4"],["at_capacity","reservationResolved","receiving",""],
     ["receiving","licenceOrSuspension","ineligible","§8 routing rule 1"],["ineligible","resolved","receiving",""],
     ["closed","licenceOrSuspension","ineligible",""],["paused","licenceOrSuspension","ineligible",""],["at_capacity","licenceOrSuspension","ineligible",""]],
  note:"terminal is EMPTY, deliberately — a branch does not finish, it cycles. D13: every non-receiving state names itself on the branch home, which is why they are states and not a predicate inside the router."},

 {id:"Outbox",bp:"§6 Session & outbox (client-only, BD-9)",owner:"platform-foundation",
  initial:["queued"],terminal:["accepted","cancelled"],
  t:[["queued","markSending","sending","attempts += 1"],["queued","cancel","cancelled","R13's only action"],
     ["sending","2xx","accepted",""],["sending","409","accepted","A DUPLICATE IS SUCCESS"],
     ["sending","permanent","rejected",""],["sending","exhausted","queued","requeued — visible, never dropped"],
     ["rejected","requeue","queued",""],["rejected","cancel","cancelled",""]],
  note:"There is deliberately NO `duplicate` state — it was unreachable, and it was a latent leak: pendingCount did not count it and prune did not remove it. ⚠ TD-13: cancel refuses SILENTLY while an item is sending."},
],

 {id:"E8",g:"Entry",t:"منطقتك",p:"Where to search from",back:"pop",pri:"خلص → S1, then D26's replay",

/* ── 8. DECISIONS ───────────────────────────────────────────────────────── */
decisions:[
 ["D01","Account and Subject are separated; a Subject need not authenticate"],
 ["D02","A family member without an account can be invited"],
 ["D03","One phone, one Account, many Subjects — the Iraqi household is first-class"],
 ["D04","Memorialisation is a Subject state with a defined trigger"],
 ["D05","Deletion is defined exactly, including what survives on the pharmacy side"],
 ["D06","A Request carries lines; an Offer answers per line; a Reservation covers one branch"],
 ["D07","The unit of quantity is the pack, defined by the catalogue"],
 ["D08","The offer price binds for the reservation window; there is no public price anywhere"],
 ["D09","The request window is a defined duration per urgency, and it drives routing"],
 ["D10","The area unit is the curated district; branch location is verified during application"],
 ["D11","Reliability is one number, defined, banded, and forgiving of the honest case"],
 ["D12","No preferential routing, and no paid placement, ever"],
 ["D13","A branch is told when and why it is not receiving requests"],
 ["D14","The code is the collection right; identity is not checked at the counter"],
 ["D15","A pharmacy has data rights: an access log, an export, and a way to leave"],
 ["D16","Phase 0 performs no interaction checking, and says so in the product"],
 ["D17","Allergies are removed from Phase 0 entirely, including from the permission matrix"],
 ["D18","Prescription-required items cannot be requested without a prescription image"],
 ["D19","Confirming a hold is commercial; proposing a substitution is clinical"],
 ["D20","Phase 0 has no two-person controls because it has no actions that need them"],
 ["D21","Clinical governance authority and the 2am safety path are Phase 3 prerequisites"],
 ["D22","The record is built from completed pickups; Phase 0 predicts nothing"],
 ["D23","Phase 0's exit criterion tests the strategy's riskiest belief"],
 ["D24","Phase 0 is a closed system: it references no later phase"],
 ["D25","The pharmacy application flow exists as screens"],
 ["D26","Guest is a first-class state in the navigation model"],
 ["D27","The outbox is a screen"],
 ["D28","One rule for clinical data on the device"],
 ["D29","Two retention promises are narrowed to what is actually true"],
 ["D30","Notify-me is an entity with a lifecycle"],
 ["D31","Post-pickup ratings are removed; the price dispute is the only signal collected"],
 ["D32","One permission model, extended to cover branch settings"],
 ["D33","Ramadan is a scheduling model, not an exception list"],
 ["D34","Phase 0 is Arabic only; Kurdish is deferred with the schema reserved"],
 ["D35","Phase 0 depends on no premium OS capability"],
 ["D36","Arabic copy is gender-neutral by construction"],
 ["D37","The two highest-stakes strings are rewritten to be unambiguous and blameless"],
 ["D38","The pharmacy support channel exists as screens"],
 ["D39","What a pharmacy owes when it confirms and cannot deliver"],
 ["D40","The launch district is a configuration value, fixed before Phase 0 opens"],
 ["D41","Phase 0 is scoped so that it does not depend on the regulatory answer"],
 ["D42","Controlled substances are refused in Phase 0"],
 ["D43","Nobody pays in Phase 0 or Phase 1, and nothing is built that assumes revenue"],
],

/* ── 9. RULES / QUANTITIES ──────────────────────────────────────────────── */
rules:[
 {id:"Urgency windows",v:"now 20m · today 4h · soon 2 days",d:"D09",w:"«خلال يومين», deliberately not 'this week'. No other value exists."},
 {id:"Max request lines",v:"8",d:"§2 Request",w:"More is a shopping list a pharmacist cannot answer at a counter."},
 {id:"Pack minimum",v:"1",d:"D07",w:"The unit is the pack, and there is no other unit."},
 {id:"Pack maximum",v:"NONE — 1,000,000 accepted",d:"TD-16",w:"Blueprint v3 does not state one, and any ceiling chosen here would be an invented business rule."},
 {id:"Refusal grace",v:"5 minutes",d:"D11",w:"A refusal within 5 minutes of confirming is the honest 'sold since' case. v1 penalised a structurally guaranteed event."},
 {id:"Honoured min sample",v:"10 reservations",d:"D11",w:"Below this a band would be noise; the answer is `new`."},
 {id:"Honoured window",v:"60 days",d:"D11",w:"Recent behaviour, not history."},
 {id:"trusted threshold",v:"≥ 95%",d:"D11",w:"Returns a BAND, never a number. A decimal invites an argument about a number instead of about the behaviour."},
 {id:"Managed subject limit",v:"6",d:"§4 S3",w:"A household, not a directory."},
 {id:"Peer invite TTL",v:"7 days",d:"D02",w:""},
 {id:"Memorial reversal",v:"30 days",d:"D04",w:"And not at 30 days plus one second — the declared test says so."},
 {id:"Account deletion window",v:"30 days",d:"D05",w:"Signing in cancels it."},
 {id:"Code attempts",v:"5",d:"E6",w:"Expiry is checked BEFORE the attempt is counted."},
 {id:"Code lifetime",v:"10 minutes",d:"E6",w:""},
 {id:"Resend cooldown",v:"45 seconds",d:"E6",w:"A resend that works instantly invites three codes, only the last of which works — which then reads as the app sending broken codes."},
 {id:"Watches per subject",v:"5, expiring at 14 days",d:"D30",w:""},
 {id:"Licence warnings",v:"60 / 30 / 7 days",d:"§6",w:""},
 {id:"Retry policy",v:"6 attempts, 1s base, 60s cap, FULL JITTER",d:"§21",w:"Deliberately patient. Iraqi mobile data returns in bursts. Jitter, because when a tower returns every queued device retries at once."},
 {id:"Watch poll interval",v:"3 seconds",d:"TD-21",w:"Transport, not product. Nothing a patient sees derives from it, and the loop ends when the window closes."},
 {id:"UI tick",v:"1 second",d:"E6",w:"E6 counts in seconds, and a countdown that lags its own unit reads as broken."},
 {id:"Iraq UTC offset",v:"+03:00, permanent",d:"§3 · D40",w:"Iraq abolished daylight saving in 2008 — there is no second offset and no date on which this changes."},
 {id:"Contrast floors",v:"body 4.5 · large 3.0 · UI 3.0",d:"§25",w:"Measured, never eyeballed — amber on cream failed at 4.08:1 in the prototype and looked fine."},
 {id:"Touch targets",v:"44 min · 48 patient primary · 56 pharmacy primary",d:"§25",w:"The pharmacy device is used one-handed at speed with a customer waiting."},
 {id:"Clinical type floor",v:"16pt — `caption` is barred by type",d:"§25",w:"The target user is frequently elderly or low-vision, and that is the MEDIAN user."},
 {id:"Letter spacing",v:"0, typed as the literal 0",d:"§25",w:"Arabic is a connected script and tracking breaks the joins. The one exception is a 6-digit LTR code, and it is a named token."},
 {id:"Motion ceiling",v:"500ms, except a signature moment",d:"§27",w:"Every animation must answer 'what did this teach the user?' Motion with no answer is latency in a costume. Loops are exempt — a 1.8s pulse is a heartbeat, not a slow transition."},
],

  a.innerHTML=(body.includes("<h3")||!title?"":`<h3>${esc(title)}</h3>`)+body;

}

P.machines=()=>`
<h2>State machines <span class="n">8 declared in @dawai/domain · 1 client-only (the outbox)</span></h2>
<p class="lede">A machine <b>is</b> its transition table. <code>transition()</code> is the only way to move, so a
transition the Blueprint does not contain is <b>unrepresentable rather than merely forbidden</b>.
Every edge carries its own Blueprint reference, so a reviewer can check one arrow without reading the file.</p>
<div class="legend"><span><span class="st init">initial</span></span><span><span class="st term">terminal</span></span>
<span><b>audit()</b> proves: every state reachable · every non-terminal has an exit · every edge has a reference ·
no two transitions leave one state on one event · at least one terminal declared</span></div>
${D.machines.map(m=>{
 const all=new Set([...m.initial,...m.terminal]); m.t.forEach(t=>{all.add(t[0]);all.add(t[2]);});
 const st=[...all].map(s=>`<span class="st ${m.initial.includes(s)?"init":m.terminal.includes(s)?"term":""}">${esc(s)}</span>`).join("");
 const rows=m.t.map(t=>`<tr><td>${esc(t[0])}</td><td>— ${esc(t[1])} →</td><td>${esc(t[2])}</td><td>${esc(t[3]||"")}</td></tr>`).join("");
 const det=`<div class="kind">state machine</div><h3>${esc(m.id)}</h3>`+dl([
   ["Blueprint",esc(m.bp)],["Owner","<code>"+esc(m.owner)+"</code>"],
   ["Initial",m.initial.map(esc).join(" · ")],["Terminal",m.terminal.length?m.terminal.map(esc).join(" · "):"<i>none — deliberately</i>"],
   ["Transitions",String(m.t.length)],["Note",esc(m.note||"")],["Read","05-state-machines.md"]]);
 const id="n"+(nodeSeq++); NODES[id]={t:m.id,d:det};
 return `<div class="mach"><h5><button class="chip" data-n="${id}" style="padding:2px 10px">${esc(m.id)}</button></h5>
  <div class="meta">${esc(m.bp)} · owner <code>${esc(m.owner)}</code> · ${m.t.length} transitions</div>
  <div class="states">${st}</div>
  <div class="scroller"><table class="tr"><thead><tr><th>from</th><th>on</th><th>to</th><th>reference / note</th></tr></thead>
  <tbody>${rows}</tbody></table></div>
  ${m.note?`<p class="note">${esc(m.note)}</p>`:""}</div>`;}).join("")}`;

P.nav=()=>`

<p class="lede">Principle 2: <b>the app must never feel like a collection of pages, and must never dead-end.</b>

into <b>findable graph properties</b>, and back is answered <b>once</b>.</p>

<div class="group"><h4>Graph properties a test checks</h4><div class="grid">
${[["unreachable(g)","Screens no entry point can reach — a screen a user cannot get to"],
   ["traps(g)","No exits AND back:none — nowhere to go and no way back"],
   ["danglingExits(g)","An exit naming a screen that does not exist — A BUTTON THAT GOES NOWHERE"],
   ["flowGaps(g,flows)","A flow step, completesAt or abandonsTo not in the graph — a journey the user can begin and cannot finish"]]
  .map(([t,s])=>node(t,s,[],dl([["Function","<code>"+esc(t)+"</code>"],["Finds",esc(s)],["Read","08-navigation.md"]]))).join("")}
</div></div>

<div class="group"><h4>Back — resolved once</h4><div class="grid">
${[["pop","Ordinary stack pop. With an EMPTY history it lands on the destination root — that screen was deep-linked into, and leaving the user nowhere is not an option"],
   ["dismiss(returnsTo)","Close a modal, return to its opener"],
   ["replace(with, why)","A screen the user must NOT return to — a completed deletion, a signed-out state, a notification arrival"],
   ["none(why)","Only where the OS gesture would leave the app. MUST state the reason — auditContract rejects a bare `none`"]]
  .map(([t,s])=>node(t,s,[],dl([["Behaviour","<code>"+esc(t)+"</code>"],["Meaning",esc(s)]]))).join("")}
${node("The one reducer override","E4's «مو هسه — رجعني لطلبي»",[["D26","vio"]],
 dl([["Problem","A contract's <code>back</code> names one fixed screen, so E4 declares dismiss→S1 — and that sent a patient to Today's stand-in instead of the request it had just named back to them."],
     ["Rule","The distinguishing fact is a PRESERVED ACTION, and the guard put it there on the way in. R7 dismisses with nothing pending and lands where the graph says; E4 dismisses with a pending action and lands on the screen the patient was using."],
     ["Subtlety","The pending intent is NOT the destination — it records the screen the guard REFUSED, which is where D26 replays them AFTER they sign in."]]))}
</div></div>

<div class="group"><h4>Route guards — the client enforces nothing</h4><div class="grid">
${[["requireSession","not authenticated → E4 · SESSION_REQUIRED · D26 · §3.2"],
   ["requireOrderScope","the domain did not grant `order` → S4 · ORDER_SCOPE_REQUIRED"],
   ["blockMemorialised","the active subject is memorialised → S1 · SUBJECT_MEMORIALISED · D04"]]
  .map(([t,s])=>node(t,s,[["guard","info"]],dl([["Guard","<code>"+esc(t)+"</code>"],["Behaviour",esc(s)],
   ["Rule","§5 rule 1 — hidden UI is not a permission. A guard exists purely so the user is not shown a door that will be slammed. <b>The server still refuses, always.</b>"],
   ["RedirectReason is a CODE, not a sentence","Navigation is persona-agnostic — the pharmacy and owner apps run on the same graph. A guard that returns Arabic patient copy is a shared rule with an opinion about one app's screens. It also duplicated: the same sentence was written here AND in the app, so the two could drift."]]))).join("")}
${node("runGuards","FIRST refusal wins",[[" ","info"]],dl([["Why","So the reason the user reads is <b>the first thing that actually stopped them</b> rather than the last."]]))}
${node("Guards run TWICE","at the door, and again at the action",[["§5 rule 1","ok"]],
 dl([["Where","<code>store.ts doSend</code> re-runs R6's guards at the moment of sending."],
     ["Why","A screen opened while permitted may be acted on after the grant was revoked, and <b>the disabled button is a courtesy, not a control</b>."]]))}
${node("F1 and F2 are UNGUARDED","deliberately",[["§3.1","ok"]],
 dl([["Why","A guest browses and searches before giving us anything, and the account is asked for at the first action that needs one."]]))}
</div></div>

<div class="group"><h4>Deep links resolve to a STACK, never a bare screen</h4><div class="grid">

   ["dawai://watch/{id}","MeStack → R12"],["dawai-rx://request/{id}","Pharmacy InboxStack → P5, with P3 beneath"]]
  .map(([t,s])=>node(t,s,[],dl([["Deep link","<code>"+esc(t)+"</code>"],["Resolves to",esc(s)],
   ["Why","Landing on a detail with no parent traps the user, and <b>a notification is the most common way to arrive somewhere with no history</b>."]]))).join("")}

<div class="group"><h4>Role isolation</h4><div class="grid">
${node("Different navigators, not branches","A patient build contains NO pharmacy route",[["structural","ok"]],

${node("TD-20 · cancel a broadcast request","The API declares the endpoint; the §6 machine has no edge for it",[["blocked","bad"]],
 dl([["The conflict","<code>POST /v1/requests/{id}/cancel</code> is declared (200 / 404 / 409). A patient on R7 is in <code>broadcast</code> or <code>answered</code>, and the Request machine's only two edges are <code>cancelFromOutbox</code> (a request that never left the device) and <code>abandon</code>."],
     ["Why it cannot be built","Calling the endpoint would return a request in a state the client has no edge to reach, and <b>adding that edge is inventing a state transition</b>, which Rule 5 refuses."],
     ["Resolution","Either §6 gains the transition, or §4 R7 loses the control."]]))}
${node("TD-24 · R1's guards vs §3.1","If R1 needs a session, no guest can build the request E4 promises to keep",[["blocked","bad"]],
 dl([["The conflict","§4 gives R1 <code>requireSession</code>. §3.1 forbids a sign-in wall, D26 preserves the work, and E4 is drawn showing a draft <b>only a guest could have built</b>."],
     ["Current state","<code>addItem</code> calls <code>navigate</code> rather than <code>open</code>, so the guards never run — <b>and that bypass is the only reason the product works end to end</b>."],
     ["Smallest resolution","R1 loses <code>requireSession</code>. It is what the drawn product already does; the guard list is what is out of step."]]))}
${node("BD-10 · routing rule 5 vs scope","Excludes a branch that marked 'not carried', but nothing persists the mark",[["blocked","warn"]],
 dl([["The conflict","The stock module was removed from Phase 0. Rule 5 is documented and unimplementable; the decline reason is recorded on <code>offer_lines</code> only."]]))}
${node("The two-track question","Which Dawai is the product?",[["THE decision","bad"]],
 dl([["The conflict","<code>platform/</code> and <code>dawai-platform/</code> use different entity names, different authentication, and directly contradicting clinical policy — <b>D16 removed interaction checking from Phase 0, and migrations 0005–0007 build exactly that</b>."],
     ["One question settles it","Does Phase 0 perform interaction checking — yes or no?"],
     ["Read","19-open-decisions.md §1"]]))}
</div></div>`;

/* ── build ──────────────────────────────────────────────────────────────── */
function build(){
 $("#tabs").innerHTML=TABS.map(([k,l],i)=>`<button data-tab="${k}"${i===0?' aria-current="true"':""}>${l}</button>`).join("");
 $("#content").innerHTML=TABS.map(([k])=>`<section class="panel" data-tab="${k}"${k==="overview"?' data-on="1"':""}>${P[k]()}</section>`).join("");

 // index for search
 D.packages.forEach(p=>reg(p.id+" "+p.sub+" "+(p.why||""),p.id,"package","packages",pkgDetail(p)));
 D.modules.forEach(m=>reg(m.id+" "+m.sub+" "+(m.why||""),m.id,"module","packages",modDetail(m)));
 D.services.forEach(s=>reg(s.id+" "+s.sub+" "+(s.resp||[]).join(" ")+(s.forbidden||[]).join(" "),s.id,"service","services",
   `<div class="kind">service</div><h3>${esc(s.id)}</h3>`+dl([["What",esc(s.sub)],["Responsibilities",list(s.resp)],["FORBIDDEN",list(s.forbidden)]])));
 D.entities.forEach(e=>reg(e.id+" "+e.sub+" "+(e.table||"")+" "+(e.note||""),e.id,"entity","entities",
   `<div class="kind">entity</div><h3>${esc(e.id)}</h3>`+dl([["What",esc(e.sub)],["Table","<code>"+esc(e.table||"")+"</code>"],["Invariants",list(e.inv)],["Note",esc(e.note||"")]])));
 D.machines.forEach(m=>reg(m.id+" machine "+m.t.map(t=>t.join(" ")).join(" "),m.id+" machine","state machine","machines",
   `<div class="kind">state machine</div><h3>${esc(m.id)}</h3>`+dl([["Blueprint",esc(m.bp)],["Initial",m.initial.join(" · ")],["Terminal",m.terminal.join(" · ")||"none"],["Note",esc(m.note||"")]])));
 D.screens.forEach(s=>reg(s.id+" "+s.t+" "+s.p+" "+(s.note||""),s.id+" · "+s.t,"screen","screens",
   `<div class="kind">screen</div><h3>${esc(s.id)} — ${esc(s.t)}</h3>`+dl([["Purpose",esc(s.p)],["Primary",esc(s.pri)],["States",esc(s.st)],["Component",esc(s.b)],["Notes",esc(s.note||"")]])));
 D.events.forEach(e=>reg(e.n+" "+e.trig+" "+e.side,e.n,"event","events",
   `<div class="kind">event</div><h3>${esc(e.n)}</h3>`+dl([["Producer","<code>"+esc(e.p)+"</code>"],["Trigger",esc(e.trig)],["Side effect","<b>"+esc(e.side)+"</b>"]])));
 D.decisions.forEach(([id,t])=>reg(id+" "+t,id,"decision","decisions",
   `<div class="kind">decision</div><h3>${esc(id)}</h3>`+dl([["Decision",esc(t)]])));
 D.rules.forEach(r=>reg(r.id+" "+r.v+" "+r.d+" "+(r.w||""),r.id,"rule","rules",
   `<div class="kind">rule</div><h3>${esc(r.id)}</h3>`+dl([["Value","<b>"+esc(r.v)+"</b>"],["Decision",esc(r.d)],["Why",esc(r.w||"")]])));
 D.debt.forEach(d=>reg(d.id+" "+d.s+" "+d.i,d.id,"debt","debt",
   `<div class="kind">debt · ${esc(d.pr)}</div><h3>${esc(d.id)}</h3>`+dl([["Description",esc(d.s)],["Impact",esc(d.i)],["Owner","<code>"+esc(d.o)+"</code>"]])));
 D.resolved.forEach(d=>reg(d.id+" "+d.s+" "+d.r,d.id+" (resolved)","debt","debt",
   `<div class="kind">resolved</div><h3>${esc(d.id)}</h3>`+dl([["Was",esc(d.s)],["Resolved by",esc(d.r)]])));
 D.gaps.forEach(g=>reg(g.id+" "+g.g+" "+g.need,g.id,"gap","gaps",
   `<div class="kind">gap · ${esc(g.sev)}</div><h3>${esc(g.id)}</h3>`+dl([["The gap",esc(g.g)],["Needs","<b>"+esc(g.need)+"</b>"]])));
 D.flows.forEach(f=>reg(f.id+" "+f.who+" "+(f.steps||[]).join(" "),f.id,"flow","flows",
   `<div class="kind">flow</div><h3>${esc(f.id)}</h3>`+dl([["Persona",esc(f.who)],["Status",esc(f.b)],["Steps",list(f.steps)],["Failure paths",list(f.fail)]])));

 $("#stat").textContent=`${D.screens.length}/133 screens · ${D.machines.length} machines · ${D.entities.length} entities · ${D.events.length} events · ${D.debt.length} open debt · ${D.gaps.length} gaps`;
 $("#foot").innerHTML=`Generated from <code>platform/</code>, <code>docs/product/v3/{register,phase0}.js</code>,
   <code>docs/technical/model.js</code> and <code>platform/tools/review/debt.mjs</code>.
   Every claim here is verifiable in one <code>open</code>. Full prose: <code>docs/knowledge-base/</code> — start with
   <code>START_HERE.md</code>. &nbsp; <kbd>/</kbd> focuses search · <kbd>Esc</kbd> clears it.`;
}

/* ── events ─────────────────────────────────────────────────────────────── */
function go(tab){
 $$("#tabs button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.tab===tab)));
 $$("section.panel").forEach(s=>s.dataset.on=s.dataset.tab===tab?"1":"");
 window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab]");
 if(t&&t.tagName==="BUTTON"&&t.parentElement.id==="tabs"){go(t.dataset.tab);return;}
 const n=e.target.closest("[data-n]");
 if(n){$$(".node[data-sel]").forEach(x=>x.removeAttribute("data-sel"));
       if(n.classList.contains("node"))n.dataset.sel="1";
       show(NODES[n.dataset.n]);}
});

const q=$("#q");
q.addEventListener("input",()=>{
 const v=q.value.trim().toLowerCase();
 const old=$("#searchout"); if(old) old.remove();
 if(v.length<2) return;
 /* Rank so a typed id lands on the thing it names rather than on the first
    module that happens to cite it: exact label, then label prefix, then body. */
 const score=x=>{const l=x.label.toLowerCase();
   return l===v?0 : l.startsWith(v)?1 : l.includes(v)?2 : 3;};
 const hits=INDEX.filter(x=>x.key.includes(v))
                 .sort((a,b)=>score(a)-score(b)).slice(0,40);
 const html=`<div class="searchout" id="searchout"><h2>Search <span class="n">${hits.length} result${hits.length===1?"":"s"} for “${esc(q.value)}”</span></h2>
   <div class="hits">${hits.map((h,i)=>{const id="s"+i;NODES[id]={t:h.label,d:h.detail};
    return `<button class="hit" data-n="${id}" data-goto="${h.tab}">${esc(h.label)}<span class="w">${esc(h.where)}</span></button>`;}).join("")||
    '<p class="empty">Nothing matched. Try a decision id (D19), a screen (R8), an event (offer.sent), a debt id (TD-20) or a word from a rule.</p>'}</div></div>`;
 const cur=$('section.panel[data-on="1"]');
 cur.insertAdjacentHTML("afterbegin",html);
 window.scrollTo({top:0,behavior:"smooth"});
});
document.addEventListener("keydown",e=>{
 if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();}
 if(e.key==="Escape"){q.value="";const o=$("#searchout");if(o)o.remove();q.blur();}
});
$("#theme").addEventListener("click",()=>{
 const r=document.documentElement;
 const cur=r.getAttribute("data-theme");
 const sysDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
 const now=cur||(sysDark?"dark":"light");
 r.setAttribute("data-theme",now==="dark"?"light":"dark");
});

build();
</script>
</body>
</html>
