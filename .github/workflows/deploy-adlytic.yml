name: Deploy adlytic production

on:
  # Without this, there is no way to deploy at all except the Railway UI: the
  # push trigger below only fires when a commit touches one of the watched
  # paths, so a release whose diff is documentation, CI or tests — exactly the
  # shape of the close-code governance commits — merges to main and ships
  # nothing. Dispatch does not widen what gets deployed: railway-deploy.sh
  # sends latestCommit=true, so Railway still builds the tip of the branch the
  # service tracks. It only lets a human say "ship the current tip now".
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nixpacks.toml'
      - 'railway.json'
      - 'railway.toml'
      - '.npmrc'
      - '.deploy/**'
      - '.github/workflows/deploy-adlytic.yml'

concurrency:
  group: adlytic-production-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  # INVARIANT: a green run of this job means the Railway deployment trigger
  # was actually attempted AND accepted. It previously meant neither — the
  # missing-secret branch exited 0, so five consecutive commits reported a
  # successful deploy while making no network call at all.
  #
  # The logic lives in .deploy/railway-deploy.sh so it can be executed by
  # test_deploy_gate.ts against a stubbed curl. Behaviour inside a `run:`
  # block is unreachable to any test, which is how the false green survived.
  #
  # DISPATCH ONLY, and that is a correction rather than a restriction.
  # Railway's own GitHub integration already deploys every push to main — it
  # has done so all along, independently of this workflow. While RAILWAY_TOKEN
  # was unset this job failed and created nothing, so the overlap was
  # invisible. Once the token worked, every merge to main queued TWO builds of
  # the same commit: one from Railway, one from here. Under the Dockerfile
  # builder, which is slower than Nixpacks was, that backlog is visible —
  # three deployments sat QUEUED at once after two merges.
  #
  # So the push trigger keeps running `verify` (typecheck on main still has
  # value) and no longer deploys. Dispatch remains the escape hatch a
  # docs-or-CI-only release needs, which is the reason it was added.
  deploy-adlytic:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Railway deploy (fails if not attempted or not accepted)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bash .deploy/railway-deploy.sh
